<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Читалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; --font-size: 17px; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  #toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  #toolbar button {
    border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 15px;
  }
  #title {
    flex: 1;
    text-align: center;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #content {
    padding: 20px 20px 100px;
    max-width: 680px;
    margin: 0 auto;
    line-height: 1.65;
    font-size: var(--font-size);
  }
  #content p { margin: 0 0 1em; text-align: justify; }
  #content h1, #content h2, #content h3, #content h4 {
    margin: 1.4em 0 0.7em;
    line-height: 1.3;
  }
  #status { padding: 60px 20px; text-align: center; opacity: 0.6; font-size: 15px; }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.25); margin: 2.5em 0; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="smaller" aria-label="Меньше шрифт">A-</button>
    <button id="bigger" aria-label="Больше шрифт">A+</button>
    <span id="title"></span>
  </div>
  <div id="status">Загрузка…</div>
  <div id="content" style="display:none"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(location.search);
    const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    const bookId = params.get('book') || startParam;

    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('title');

    let fontSize = 17;
    function applyFont() {
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
    }
    document.getElementById('bigger').onclick = () => { fontSize = Math.min(fontSize + 1, 28); applyFont(); saveFont(); };
    document.getElementById('smaller').onclick = () => { fontSize = Math.max(fontSize - 1, 13); applyFont(); saveFont(); };

    function saveFont() {
      try { localStorage.setItem('reader_font_size', String(fontSize)); } catch (e) {}
    }
    function restoreFont() {
      try {
        const v = localStorage.getItem('reader_font_size');
        if (v) fontSize = parseInt(v, 10);
      } catch (e) {}
      applyFont();
    }

    function scrollKey() { return 'scroll_' + bookId; }

    function restoreScroll() {
      const key = scrollKey();
      if (tg && tg.CloudStorage) {
        tg.CloudStorage.getItem(key, (err, value) => {
          if (!err && value) window.scrollTo(0, parseInt(value, 10));
        });
      } else {
        try {
          const v = localStorage.getItem(key);
          if (v) window.scrollTo(0, parseInt(v, 10));
        } catch (e) {}
      }
    }

    let saveTimer = null;
    window.addEventListener('scroll', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const key = scrollKey();
        const value = String(window.scrollY);
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem(key, value);
        } else {
          try { localStorage.setItem(key, value); } catch (e) {}
        }
      }, 400);
    });

    async function load() {
      if (!bookId) {
        statusEl.textContent = 'Книга не выбрана.';
        return;
      }
      try {
        const res = await fetch(`/api/book/${bookId}`);
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || res.statusText);
        }
        const data = await res.json();
        titleEl.textContent = data.title || '';
        if (tg) tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
        contentEl.innerHTML = data.chapters.map(c => c.html).join('<hr/>');
        statusEl.style.display = 'none';
        contentEl.style.display = 'block';
        restoreScroll();
      } catch (e) {
        statusEl.textContent = 'Не удалось загрузить книгу 😕\n' + e.message;
      }
    }

    restoreFont();
    load();
  </script>
</body>
</html>
