<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Читалка</title>
<!-- rb-autoscroll-accum-20260908 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; --font-size: 17px; --accent: var(--tg-theme-button-color, #2481cc); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- layout ---------- */
  #app { display: flex; flex-direction: column; height: 100%; }
  #screens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
  .screen { display: none; padding: 12px 14px 8px; }
  .screen.active { display: block; }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    border-top: 1px solid rgba(127,127,127,0.2);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  #tabbar button {
    flex: 1; border: none; background: none; padding: 10px 0 8px;
    font-size: 11px; color: var(--tg-theme-hint-color, #888);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  #tabbar button .icon { font-size: 20px; }
  #tabbar button.active { color: var(--accent); }

  /* ---------- search ---------- */
  #searchInput {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: none;
    background: var(--tg-theme-secondary-bg-color, #f0f0f2);
    color: inherit; font-size: 16px; margin-bottom: 12px;
  }
  #searchInput:focus { outline: 2px solid var(--accent); }
  #searchHint { text-align: center; opacity: 0.5; padding: 40px 20px; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 14px 10px;
  }
  .card { display: flex; flex-direction: column; text-align: left; width: 100%; min-width: 0; }
  .cover {
    width: 100%; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
    background: linear-gradient(135deg, #7f7fd5, #86a8e7 50%, #91eae4);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .fallback { color: #fff; font-size: 30px; opacity: 0.85; padding: 6px; text-align: center; }
  .card .t { font-size: 13px; font-weight: 600; margin-top: 6px; line-height: 1.25;
    overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
  .card .a { font-size: 11.5px; opacity: 0.6; margin-top: 2px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; top: 5px; right: 5px; font-size: 13px;
    background: rgba(0,0,0,0.45); border-radius: 6px; padding: 1px 4px; color: #fff; }
  .card-del {
    position: absolute; top: 4px; left: 4px; z-index: 3;
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: rgba(255,70,70,0.95); color: #fff; font-size: 18px; line-height: 26px;
    padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }

  /* ---------- library ---------- */
  #statsRow { display: flex; gap: 8px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--tg-theme-secondary-bg-color, #f0f0f2); border-radius: 12px;
    padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; opacity: 0.6; }
  .empty-hint { opacity: 0.5; font-size: 13px; padding: 24px 8px; text-align: center; }

  .folder-grid { display: flex; flex-direction: column; gap: 12px; }
  .folder-card {
    display: flex; align-items: center; gap: 14px; width: 100%;
    border: none; border-radius: 16px; padding: 14px 16px; text-align: left;
    background: var(--tg-theme-secondary-bg-color, #f0f0f2); color: inherit;
  }
  .folder-icon {
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .folder-icon.history { background: linear-gradient(135deg,#ff9a56,#ff6a88); }
  .folder-icon.bookmarks { background: linear-gradient(135deg,#f6d365,#fda085); }
  .folder-icon.toread { background: linear-gradient(135deg,#43cea2,#185a9d); }
  .folder-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .folder-title { font-size: 16px; font-weight: 700; }
  .folder-count { font-size: 13px; opacity: 0.55; margin-top: 2px; }
  .folder-chevron { opacity: 0.35; font-size: 22px; }

  #libraryFolder { display: none; }
  #libraryFolder.open { display: block; }
  #libraryHome.hidden { display: none; }
  .folder-nav {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .folder-nav button {
    border: none; background: var(--tg-theme-secondary-bg-color, #f0f0f2);
    color: inherit; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600;
  }
  .folder-nav h2 { flex: 1; margin: 0; font-size: 17px; }
  .folder-nav button.on { background: var(--accent); color: #fff; }

  /* ---------- reader ---------- */
  #reader { position: fixed; inset: 0; background: var(--tg-theme-bg-color, #fff); z-index: 50; display: none; flex-direction: column; }
  #reader.active { display: flex; }
  #readerToolbar {
    display: flex; align-items: center; gap: 4px; padding: 8px 8px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    flex-shrink: 0; overflow-x: auto; flex-wrap: nowrap;
  }
  #reader.chrome-hidden #readerToolbar {
    height: 0; padding: 0; overflow: hidden; border: none; opacity: 0;
    pointer-events: none;
  }
  #readerToolbar button {
    border: none; background: none; font-size: 17px; padding: 6px 7px; border-radius: 8px; color: inherit;
    flex-shrink: 0;
  }
  #readerToolbar button.on { background: var(--accent); color: #fff; border-radius: 8px; }
  #readerToolbar .fsz { font-size: 13px; background: var(--tg-theme-bg-color, #fff); border-radius: 8px; }
  #readerTitle { flex: 1; text-align: center; font-weight: 600; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 40px; }
  #chromePeek {
    display: none; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    z-index: 60; border: none; border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,0.45); color: #fff;
  }
  #reader.chrome-hidden #chromePeek { display: block; }
  #status { padding: 60px 20px; text-align: center; opacity: 0.6; font-size: 15px; white-space: pre-line; }

  /* Пагинация НЕ через CSS columns (у WebKit при сотнях "страниц" там давно
     известные баги с наездом текста/пропажей страниц) — а обычным вертикальным
     скроллом, который мы либо листаем программно по экрану (paged), либо
     отдаём как есть браузеру (scroll/лента). */
  /* overflow-y:hidden в paged-режиме принципиально — иначе WebKit пытается
     ОДНОВРЕМЕННО со своей нативной инерцией скроллить контейнер, пока наш JS
     позиционирует его через scrollTop, и текст дёргается туда-сюда */
  #pager { position: relative; flex: 1; overflow-y: hidden; overflow-x: hidden; touch-action: none; overscroll-behavior: none; }
  #pager.scroll-mode { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #columns {
    padding: 4px 20px 40px; line-height: 1.65; font-size: var(--font-size);
    max-width: 100%; overflow-x: hidden; word-wrap: break-word;
  }
  #columns p { margin: 0 0 1em; text-align: justify; }
  #columns h1, #columns h2, #columns h3, #columns h4 { margin: 1.4em 0 0.7em; line-height: 1.3; }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.25); margin: 2.5em 0; }
  #tap-prev, #tap-next { position: absolute; top: 0; bottom: 0; width: 25%; z-index: 5; }
  #tap-prev { left: 0; } #tap-next { right: 0; }
  #pager.scroll-mode #tap-prev, #pager.scroll-mode #tap-next { display: none; }
  #pageIndicator { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: 12px; opacity: 0.5; pointer-events: none; background: var(--tg-theme-bg-color, #fff); }
  #pager.scroll-mode #pageIndicator { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="screens">
    <div class="screen active" id="screen-search">
      <input id="searchInput" placeholder="Название книги или автор…" />
      <div id="searchHint">Начни печатать, чтобы найти книгу</div>
      <div id="searchResults" class="grid"></div>
    </div>

    <div class="screen" id="screen-library">
      <div id="libraryHome">
        <div id="statsRow"></div>
        <div class="folder-grid">
          <button type="button" class="folder-card" data-folder="history">
            <div class="folder-icon history">📖</div>
            <div class="folder-text">
              <div class="folder-title">Продолжить чтение</div>
              <div class="folder-count" id="historyCount">0 книг</div>
            </div>
            <span class="folder-chevron">›</span>
          </button>
          <button type="button" class="folder-card" data-folder="bookmarks">
            <div class="folder-icon bookmarks">🔖</div>
            <div class="folder-text">
              <div class="folder-title">Закладки</div>
              <div class="folder-count" id="bookmarksCount">0 книг</div>
            </div>
            <span class="folder-chevron">›</span>
          </button>
          <button type="button" class="folder-card" data-folder="toread">
            <div class="folder-icon toread">➕</div>
            <div class="folder-text">
              <div class="folder-title">Читать дальше</div>
              <div class="folder-count" id="toReadCount">0 книг</div>
            </div>
            <span class="folder-chevron">›</span>
          </button>
        </div>
        <button id="resetBtn" style="margin-top:26px;width:100%;padding:12px;border:none;border-radius:12px;background:rgba(255,70,70,0.12);color:#ff4757;font-size:14px;font-weight:600;">
          🗑 Сбросить закладки и историю
        </button>
      </div>

      <div id="libraryFolder">
        <div class="folder-nav">
          <button type="button" id="folderBack">← Назад</button>
          <h2 id="folderHeading"></h2>
          <button type="button" id="folderEdit">Изменить</button>
        </div>
        <div id="folderGrid" class="grid"></div>
        <div class="empty-hint" id="folderEmpty" hidden>Пока пусто</div>
      </div>
    </div>
  </div>

  <div id="tabbar">
    <button data-tab="search" class="active"><span class="icon">🔍</span>Поиск</button>
    <button data-tab="library"><span class="icon">📚</span>Библиотека</button>
  </div>
</div>

<div id="reader">
  <div id="readerToolbar">
    <button id="backBtn" title="Закрыть книгу">←</button>
    <button id="bookmarkBtn" title="Закладка">🔖</button>
    <button id="toReadBtn" title="Читать дальше">➕</button>
    <span id="readerTitle"></span>
    <button class="fsz" id="modeBtn" title="Постранично / лентой">📖</button>
    <button class="fsz" id="autoBtn" title="Старт / пауза автопрокрутки">▶️</button>
    <button class="fsz" id="speedBtn" title="Скорость автопрокрутки">1×</button>
    <button class="fsz" id="smaller" title="Мельче">A-</button>
    <button class="fsz" id="bigger" title="Крупнее">A+</button>
    <button class="fsz" id="hideChromeBtn" title="Спрятать панель">⌃</button>
  </div>
  <button type="button" id="chromePeek">настройки ▾</button>
  <div id="status">Загрузка…</div>
  <div id="pager" style="display:none">
    <div id="columns"></div>
    <div id="tap-prev"></div>
    <div id="tap-next"></div>
    <div id="pageIndicator"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;

const params = new URLSearchParams(location.search);
const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
const directBookId = params.get('book') || startParam || null;

const FOLDER_META = {
  history: { title: 'Продолжить чтение', empty: 'Пока ничего не читала', path: 'history' },
  bookmarks: { title: 'Закладки', empty: 'Нет закладок', path: 'bookmark' },
  toread: { title: 'Читать дальше', empty: 'Список пуст', path: 'to-read' },
};

/* ---------------- helpers ---------------- */
function bookCard(b, opts) {
  opts = opts || {};
  const el = document.createElement('button');
  el.className = 'card';
  el.style.cssText = 'border:none;background:none;padding:0;color:inherit;';
  const badge = b.finished ? '✓' : (b.total_pages ? `${Math.round(100*(b.last_page+1)/b.total_pages)}%` : '');
  el.innerHTML = `
    <div class="cover">
      <img loading="lazy" src="/api/cover/${b.id}" onerror="this.remove()" onload="this.nextElementSibling.remove()" />
      <div class="fallback">📖</div>
      ${badge ? `<div class="badge">${badge}</div>` : ''}
    </div>
    <div class="t">${escapeHtml(b.title || '')}</div>
    <div class="a">${escapeHtml(b.author || '')}</div>
  `;
  if (opts.editable) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'card-del';
    del.setAttribute('aria-label', 'Удалить');
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (opts.onRemove) opts.onRemove(b);
    });
    el.querySelector('.cover').appendChild(del);
  }
  el.addEventListener('click', () => {
    if (opts.editable) return;
    openReader(b.id);
  });
  return el;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function renderGrid(container, items, opts) {
  container.innerHTML = '';
  items.forEach(b => container.appendChild(bookCard(b, opts)));
}
function pluralBooks(n) {
  const mod10 = n % 10, mod100 = n % 100;
  let word = 'книг';
  if (mod100 < 11 || mod100 > 14) {
    if (mod10 === 1) word = 'книга';
    else if (mod10 >= 2 && mod10 <= 4) word = 'книги';
  }
  return `${n} ${word}`;
}

/* ---------------- tabs ---------------- */
document.querySelectorAll('#tabbar button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
function switchTab(name) {
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  if (name === 'library') {
    closeFolder();
    loadLibrary();
  }
}

/* ---------------- search ---------------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchHint = document.getElementById('searchHint');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { searchResults.innerHTML = ''; searchHint.style.display = 'block'; searchHint.textContent = 'Начни печатать, чтобы найти книгу'; return; }
  searchTimer = setTimeout(() => runSearch(q), 350);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchInput.blur();
});
searchResults.addEventListener('touchstart', () => searchInput.blur(), { passive: true });
async function runSearch(q) {
  searchHint.style.display = 'block';
  searchHint.textContent = 'Ищу…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const items = await res.json();
    searchHint.style.display = items.length ? 'none' : 'block';
    if (!items.length) searchHint.textContent = 'Ничего не нашла 🤷';
    renderGrid(searchResults, items);
  } catch (e) {
    searchHint.style.display = 'block';
    searchHint.textContent = 'Ошибка поиска';
  }
}

/* ---------------- library ---------------- */
let libraryData = { history: [], bookmarks: [], to_read: [] };
let currentFolder = null;
let folderEditMode = false;

function folderItems(key) {
  if (key === 'history') return libraryData.history;
  if (key === 'bookmarks') return libraryData.bookmarks;
  return libraryData.to_read;
}

function updateFolderCounts() {
  document.getElementById('historyCount').textContent = pluralBooks(libraryData.history.length);
  document.getElementById('bookmarksCount').textContent = pluralBooks(libraryData.bookmarks.length);
  document.getElementById('toReadCount').textContent = pluralBooks(libraryData.to_read.length);
}

async function loadLibrary() {
  if (!userId) return;
  try {
    const res = await fetch(`/api/library/${userId}/overview`);
    const data = await res.json();
    libraryData = {
      history: data.history || [],
      bookmarks: data.bookmarks || [],
      to_read: data.to_read || [],
    };
    const s = data.stats;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat"><b>${s.books_opened}</b><span>открыто</span></div>
      <div class="stat"><b>${s.books_finished}</b><span>дочитано</span></div>
      <div class="stat"><b>${s.bookmarks_count}</b><span>закладок</span></div>
    `;
    updateFolderCounts();
    if (currentFolder) renderFolder();
  } catch (e) { /* тихо */ }
}

function openFolder(key) {
  currentFolder = key;
  folderEditMode = false;
  document.getElementById('libraryHome').classList.add('hidden');
  document.getElementById('libraryFolder').classList.add('open');
  document.getElementById('folderHeading').textContent = FOLDER_META[key].title;
  document.getElementById('folderEdit').textContent = 'Изменить';
  document.getElementById('folderEdit').classList.remove('on');
  renderFolder();
}
function closeFolder() {
  currentFolder = null;
  folderEditMode = false;
  document.getElementById('libraryHome').classList.remove('hidden');
  document.getElementById('libraryFolder').classList.remove('open');
}
function renderFolder() {
  if (!currentFolder) return;
  const items = folderItems(currentFolder);
  const empty = document.getElementById('folderEmpty');
  empty.hidden = items.length > 0;
  empty.textContent = FOLDER_META[currentFolder].empty;
  renderGrid(document.getElementById('folderGrid'), items, {
    editable: folderEditMode,
    onRemove: removeFromFolder,
  });
}

async function removeFromFolder(book) {
  if (!userId || !currentFolder) return;
  const path = FOLDER_META[currentFolder].path;
  try {
    await fetch(`/api/library/${userId}/${path}/${book.id}`, { method: 'DELETE' });
    const list = folderItems(currentFolder);
    const idx = list.findIndex(x => x.id === book.id);
    if (idx >= 0) list.splice(idx, 1);
    updateFolderCounts();
    renderFolder();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) { /* тихо */ }
}

document.querySelectorAll('.folder-card').forEach(btn => {
  btn.addEventListener('click', () => openFolder(btn.dataset.folder));
});
document.getElementById('folderBack').addEventListener('click', () => {
  closeFolder();
  loadLibrary();
});
document.getElementById('folderEdit').addEventListener('click', () => {
  folderEditMode = !folderEditMode;
  document.getElementById('folderEdit').textContent = folderEditMode ? 'Готово' : 'Изменить';
  document.getElementById('folderEdit').classList.toggle('on', folderEditMode);
  renderFolder();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  const warning = 'Все закладки, список "читать дальше" и история чтения будут удалены без возможности восстановить. Продолжить?';
  const doReset = () => {
    if (!userId) return;
    fetch(`/api/library/${userId}/reset`, { method: 'POST' })
      .then(() => loadLibrary())
      .then(() => { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); });
  };
  if (tg && tg.showConfirm) {
    tg.showConfirm(warning, (ok) => { if (ok) doReset(); });
  } else if (confirm(warning)) {
    doReset();
  }
});

/* ---------------- reader ---------------- */
const readerEl = document.getElementById('reader');
const statusEl = document.getElementById('status');
const pagerEl = document.getElementById('pager');
const columnsEl = document.getElementById('columns');
const readerTitleEl = document.getElementById('readerTitle');
const indicatorEl = document.getElementById('pageIndicator');
const bookmarkBtn = document.getElementById('bookmarkBtn');
const toReadBtn = document.getElementById('toReadBtn');

let fontSize = 17;
let pageHeight = 0, totalPages = 1, currentPage = 0;
let currentBookId = null;
let isBookmarked = false, isToRead = false;
let readerMode = 'paged'; // 'paged' | 'scroll'
try { readerMode = localStorage.getItem('reader_mode') || 'paged'; } catch (e) {}

const SPEED_STEPS = [24, 40, 64, 96];
const SPEED_LABELS = ['1×', '2×', '3×', '4×'];
let autoScrollSpeed = 40;
try {
  const savedSpeed = parseInt(localStorage.getItem('auto_scroll_speed') || '', 10);
  if (SPEED_STEPS.includes(savedSpeed)) autoScrollSpeed = savedSpeed;
} catch (e) {}

const modeBtn = document.getElementById('modeBtn');
const speedBtn = document.getElementById('speedBtn');
function applyMode() {
  pagerEl.classList.toggle('scroll-mode', readerMode === 'scroll');
  modeBtn.textContent = readerMode === 'paged' ? '📖' : '📜';
}
function applySpeedLabel() {
  const i = Math.max(0, SPEED_STEPS.indexOf(autoScrollSpeed));
  speedBtn.textContent = SPEED_LABELS[i] || '2×';
}
modeBtn.addEventListener('click', () => {
  readerMode = readerMode === 'paged' ? 'scroll' : 'paged';
  try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
  applyMode();
  if (readerMode === 'paged') requestAnimationFrame(recalcPages);
});
speedBtn.addEventListener('click', () => {
  const i = SPEED_STEPS.indexOf(autoScrollSpeed);
  autoScrollSpeed = SPEED_STEPS[(i + 1) % SPEED_STEPS.length];
  try { localStorage.setItem('auto_scroll_speed', String(autoScrollSpeed)); } catch (e) {}
  applySpeedLabel();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});

function setChrome(on) {
  readerEl.classList.toggle('chrome-hidden', !on);
  requestAnimationFrame(() => {
    if (readerEl.classList.contains('active') && readerMode === 'paged' && pagerEl.style.display !== 'none') {
      recalcPages();
    }
  });
}
function toggleChrome() { setChrome(readerEl.classList.contains('chrome-hidden')); }
document.getElementById('hideChromeBtn').addEventListener('click', () => setChrome(false));
document.getElementById('chromePeek').addEventListener('click', () => setChrome(true));

function applyFont() { document.documentElement.style.setProperty('--font-size', fontSize + 'px'); }
function saveFont() { try { localStorage.setItem('reader_font_size', String(fontSize)); } catch (e) {} }
function restoreFont() {
  try { const v = localStorage.getItem('reader_font_size'); if (v) fontSize = parseInt(v, 10); } catch (e) {}
  applyFont();
}
document.getElementById('bigger').onclick = () => { fontSize = Math.min(fontSize + 1, 28); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };
document.getElementById('smaller').onclick = () => { fontSize = Math.max(fontSize - 1, 13); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };

// Пагинация НЕ через CSS columns (у WebKit баги при сотнях "страниц"), а
// обычным вертикальным скроллом контейнера — либо листаем программно по
// экрану за раз (paged), либо просто отдаём скролл браузеру (лента).
function recalcPages() {
  pageHeight = pagerEl.clientHeight;
  totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
  goToPage(Math.min(currentPage, totalPages - 1));
}
function goToPage(n) {
  currentPage = Math.max(0, Math.min(n, totalPages - 1));
  pagerEl.scrollTop = currentPage * pageHeight;
  indicatorEl.textContent = `${currentPage + 1} / ${totalPages}`;
  saveProgress();
}
function nextPage() { if (readerMode === 'paged') goToPage(currentPage + 1); }
function prevPage() { if (readerMode === 'paged') goToPage(currentPage - 1); }
// click — для мыши/десктопа (свайп/тап там не бывает)
document.getElementById('tap-next').addEventListener('click', nextPage);
document.getElementById('tap-prev').addEventListener('click', prevPage);
// На touch-устройствах и тап, и свайп обрабатываем в одном touch-обработчике
// (не полагаясь на синтетический 'click' — на дочерних див-зонах внутри
// #pager с touch-action:none он срабатывает ненадёжно). Свайп — влево/вправо
// (соответствует тап-зонам tap-prev/tap-next слева/справа экрана).
let touchStartX = null;
pagerEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
pagerEl.addEventListener('touchend', e => {
  if (touchStartX === null || readerMode !== 'paged') { touchStartX = null; return; }
  const endX = e.changedTouches[0].clientX;
  const dx = endX - touchStartX;
  if (Math.abs(dx) > 40) {
    dx < 0 ? nextPage() : prevPage();
  } else {
    // это тап, не свайп — определяем зону по координате
    const w = pagerEl.clientWidth;
    if (endX < w * 0.25) prevPage();
    else if (endX > w * 0.75) nextPage();
    else toggleChrome();
  }
  touchStartX = null;
}, { passive: true });
window.addEventListener('keydown', e => {
  if (!readerEl.classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});
window.addEventListener('resize', () => { if (readerEl.classList.contains('active') && readerMode === 'paged') requestAnimationFrame(recalcPages); });

// в режиме ленты сохраняем позицию по проценту скролла
let scrollSaveTimer = null;
pagerEl.addEventListener('scroll', () => {
  if (readerMode !== 'scroll' || !currentBookId) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => {
    const frac = pagerEl.scrollTop / Math.max(1, columnsEl.scrollHeight - pagerEl.clientHeight);
    currentPage = Math.round(frac * (totalPages - 1));
    saveProgress();
  }, 500);
}, { passive: true });

function positionKey(id) { return 'page_' + id; }
let progressTimer = null;
function saveProgress() {
  if (!currentBookId) return;
  try { localStorage.setItem(positionKey(currentBookId), String(currentPage)); } catch (e) {}
  clearTimeout(progressTimer);
  progressTimer = setTimeout(() => {
    if (!userId) return;
    const finished = currentPage >= totalPages - 1;
    fetch(`/api/library/${userId}/progress/${currentBookId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: currentPage, total_pages: totalPages, finished }),
    }).catch(() => {});
  }, 600);
}
function restorePosition(id) {
  let v = 0;
  try { v = parseInt(localStorage.getItem(positionKey(id)) || '0', 10); } catch (e) {}
  return v;
}

async function openReader(bookId) {
  stopAutoScroll();
  currentBookId = bookId;
  currentPage = 0;
  readerEl.classList.add('active');
  setChrome(true);
  statusEl.style.display = 'block';
  pagerEl.style.display = 'none';
  statusEl.textContent = 'Загрузка…\nПри первом открытии книги может занять до минуты.';
  readerTitleEl.textContent = '';
  bookmarkBtn.classList.remove('on');
  toReadBtn.classList.remove('on');

  if (userId) {
    fetch(`/api/library/${userId}/state/${bookId}`).then(r => r.json()).then(st => {
      isBookmarked = st.bookmarked; isToRead = st.to_read;
      bookmarkBtn.classList.toggle('on', isBookmarked);
      toReadBtn.classList.toggle('on', isToRead);
    }).catch(() => {});
  }

  try {
    const res = await fetch(`/api/book/${bookId}`);
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const data = await res.json();
    readerTitleEl.textContent = data.title || '';
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    const coverHtml = `<div style="text-align:center;margin:0 0 1.5em;">
      <img src="/api/cover/${bookId}" style="max-width:65%;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.35);" onerror="this.parentElement.remove()" />
    </div>`;
    columnsEl.innerHTML = coverHtml + data.chapters.map(c => c.html).join('<hr/>');
    statusEl.style.display = 'none';
    pagerEl.style.display = 'block';
    applyMode();
    requestAnimationFrame(() => {
      if (readerMode === 'paged') {
        recalcPages();
        goToPage(restorePosition(bookId));
      } else {
        pageHeight = pagerEl.clientHeight;
        totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
        const savedPage = restorePosition(bookId);
        pagerEl.scrollTop = (savedPage / Math.max(1, totalPages - 1)) * (columnsEl.scrollHeight - pagerEl.clientHeight);
      }
      // панель прячем через секунду, чтобы не торчала поверх текста
      setTimeout(() => {
        if (currentBookId === bookId && readerEl.classList.contains('active')) setChrome(false);
      }, 1200);
    });
  } catch (e) {
    statusEl.textContent = 'Не удалось загрузить книгу 😕\n' + e.message;
  }
}
// ---------------- автопрокрутка (текст сам ползёт вниз) ----------------
const autoBtn = document.getElementById('autoBtn');
let autoScrollRAF = null;

function stopAutoScroll() {
  if (autoScrollRAF) cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF = null;
  autoBtn.textContent = '▶️';
  autoBtn.classList.remove('on');
}
function startAutoScroll() {
  const begin = () => {
    autoBtn.textContent = '⏸';
    autoBtn.classList.add('on');
    let last = performance.now();
    let y = pagerEl.scrollTop;
    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      // копим дробные пиксели: иначе scrollTop += 0.4 на iOS округляется в 0
      // и на 1×/2× текст стоит на месте
      y += autoScrollSpeed * dt;
      pagerEl.scrollTop = y;
      if (pagerEl.scrollTop + pagerEl.clientHeight >= columnsEl.scrollHeight - 2) {
        stopAutoScroll();
        return;
      }
      autoScrollRAF = requestAnimationFrame(step);
    }
    autoScrollRAF = requestAnimationFrame(step);
  };
  if (readerMode !== 'scroll') {
    readerMode = 'scroll';
    try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
    applyMode();
    // после смены режима вёрстке нужен кадр, чтобы пересчитать scrollHeight —
    // иначе автопрокрутка сразу решает, что уже 'в конце', и тут же гасится
    requestAnimationFrame(() => requestAnimationFrame(begin));
  } else {
    begin();
  }
}
let autoTouchHandled = false;
autoBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  autoTouchHandled = true;
  autoScrollRAF ? stopAutoScroll() : startAutoScroll();
}, { passive: false });
autoBtn.addEventListener('click', () => {
  if (autoTouchHandled) { autoTouchHandled = false; return; }
  autoScrollRAF ? stopAutoScroll() : startAutoScroll();
});

function closeReader() { stopAutoScroll(); setChrome(true); readerEl.classList.remove('active'); currentBookId = null; }
document.getElementById('backBtn').addEventListener('click', closeReader);

bookmarkBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  const res = await fetch(`/api/library/${userId}/bookmark/${currentBookId}`, { method: 'POST' });
  const data = await res.json();
  isBookmarked = data.bookmarked;
  bookmarkBtn.classList.toggle('on', isBookmarked);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});
toReadBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  const res = await fetch(`/api/library/${userId}/to-read/${currentBookId}`, { method: 'POST' });
  const data = await res.json();
  isToRead = data.to_read;
  toReadBtn.classList.toggle('on', isToRead);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});

/* ---------------- init ---------------- */
restoreFont();
applySpeedLabel();
if (directBookId) {
  openReader(directBookId);
} else {
  switchTab('search');
}
</script>
</body>
</html>
