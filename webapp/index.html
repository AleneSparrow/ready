<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Читалка</title>
<!-- rb-real-catalog-20260909 -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
    --font-size: 17px;
    --bg: #050a1c;
    --bg-2: #0b1433;
    --text: #eef4ff;
    --muted: #8aa0c8;
    --neon: #4fc3ff;
    --pink: #ff4d9a;
    --yellow: #ffe14a;
    --accent: #4fc3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  #bgfx {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(1200px 600px at 10% -10%, rgba(79,195,255,0.22), transparent 55%),
                radial-gradient(900px 500px at 110% 10%, rgba(255,77,154,0.18), transparent 50%),
                radial-gradient(800px 500px at 50% 120%, rgba(255,225,74,0.12), transparent 50%),
                var(--bg);
  }
  #bgfx::before, #bgfx::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(70px);
    animation: drift 14s ease-in-out infinite;
  }
  #bgfx::before {
    width: 280px; height: 280px; left: -60px; top: 18%;
    background: rgba(79,195,255,0.45);
  }
  #bgfx::after {
    width: 240px; height: 240px; right: -40px; bottom: 22%;
    background: rgba(255,77,154,0.4);
    animation-delay: -6s;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(30px,-24px) scale(1.15); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(79,195,255,0.6)); }
    50% { filter: drop-shadow(0 0 16px rgba(255,77,154,0.8)); }
  }
  @keyframes sheen {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }
  #screens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 14px 78px; }
  .screen { display: none; padding: 0 0 8px; }
  .screen.active { display: block; }
  #searchBar {
    position: sticky; top: 0; z-index: 15;
    padding: 12px 0 12px;
    background: linear-gradient(180deg, rgba(5,10,28,0.96), rgba(5,10,28,0.78) 70%, transparent);
  }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: rgba(8,14,40,0.86);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(79,195,255,0.35);
    box-shadow: 0 -8px 30px rgba(79,195,255,0.12);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  #tabbar button {
    flex: 1; border: none; background: none; padding: 8px 0 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  #tabbar button .icon { font-size: 26px; line-height: 1; }
  #homeTab { color: var(--neon); }
  #homeTab .icon { filter: drop-shadow(0 0 8px rgba(79,195,255,0.7)); animation: glow 3.2s ease-in-out infinite; }
  #playTab { color: var(--yellow); }
  #playTab .icon { font-size: 30px; animation-delay: -1s; filter: drop-shadow(0 0 10px rgba(255,225,74,0.85)); animation: glow 3.2s ease-in-out infinite; }
  #heartTab { color: var(--pink); }
  #heartTab .icon { filter: drop-shadow(0 0 8px rgba(255,77,154,0.7)); animation: glow 3.2s ease-in-out infinite; }
  #homeTab.active { color: var(--neon); }
  #catalogTab { color: var(--yellow); }
  #catalogTab .icon { filter: drop-shadow(0 0 8px rgba(255,225,74,0.75)); animation: glow 3.2s ease-in-out infinite; animation-delay: -1.4s; }
  #catalogTab.active { color: var(--neon); }
  #libTab, #mineTab { color: var(--neon); }
  #libTab .icon, #mineTab .icon { filter: drop-shadow(0 0 8px rgba(79,195,255,0.75)); animation: glow 3.2s ease-in-out infinite; animation-delay: -2s; }
  #libTab.active, #mineTab.active { color: var(--yellow); }

  #searchInput {
    width: 100%; height: 46px; padding: 0 16px; border-radius: 16px; border: none;
    background: rgba(12,22,56,0.85);
    color: var(--text); font-size: 16px;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.35), 0 0 18px rgba(79,195,255,0.18);
    transition: box-shadow 0.25s;
  }
  #searchInput::placeholder { color: #7f95c2; }
  #searchInput:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--yellow), 0 0 24px rgba(255,225,74,0.25), 0 0 18px rgba(79,195,255,0.35);
  }
  #searchHint { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
  .section-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin: 20px 2px 12px;
  }
  .section-head {
    font-size: 18px; font-weight: 800; margin: 0; padding: 0;
    border: none; background: transparent; text-align: left;
    background-image: linear-gradient(90deg, var(--neon), var(--pink), var(--yellow), var(--neon));
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: sheen 6s linear infinite;
  }
  button.section-head { cursor: pointer; }
  .more-btn {
    flex-shrink: 0;
    border: none; border-radius: 12px; padding: 7px 12px;
    background: rgba(79,195,255,0.16); color: var(--neon);
    font-size: 13px; font-weight: 800;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.45), 0 0 14px rgba(79,195,255,0.2);
  }
  .more-btn.wide {
    display: block; width: 100%; flex: none; margin: 10px 0 4px;
    padding: 12px; border-radius: 14px; font-size: 15px;
  }
  #continueGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 8px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px 8px;
  }
  .card {
    display: flex; flex-direction: column; text-align: left; width: 100%; min-width: 0;
    animation: rise 0.55s ease both;
  }
  .grid .card:nth-child(2) { animation-delay: .04s; } .grid .card:nth-child(3) { animation-delay: .08s; }
  .grid .card:nth-child(4) { animation-delay: .12s; } .grid .card:nth-child(5) { animation-delay: .16s; }
  .grid .card:nth-child(6) { animation-delay: .2s; } .grid .card:nth-child(7) { animation-delay: .24s; }
  .grid .card:nth-child(8) { animation-delay: .28s; }
  .cover {
    width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
    background: linear-gradient(160deg, #1b3b8a, #6a1b6b 55%, #c9a227);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.4), 0 10px 24px rgba(0,0,0,0.45), 0 0 16px rgba(79,195,255,0.22);
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:active .cover {
    transform: scale(0.96);
    box-shadow: 0 0 0 1px var(--yellow), 0 0 22px rgba(255,225,74,0.35);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .fallback { color: #fff; font-size: 30px; opacity: 0.85; padding: 6px; text-align: center; }
  .card .t { font-size: 11.5px; font-weight: 700; margin-top: 5px; line-height: 1.2;
    overflow-wrap: break-word; word-break: break-word; max-width: 100%; color: #f4f7ff;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .a { font-size: 10.5px; color: var(--muted); margin-top: 1px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-like, .card-lib {
    position: absolute; z-index: 4;
    width: 24px; height: 24px; border: none; border-radius: 8px;
    font-size: 12px; line-height: 24px; padding: 0;
    background: rgba(5,10,28,0.72); color: #fff;
    box-shadow: 0 0 8px rgba(79,195,255,0.35);
  }
  .card-like { top: 4px; right: 4px; }
  .card-like.on { background: var(--pink); box-shadow: 0 0 12px rgba(255,77,154,0.75); }
  .card-lib { top: 4px; left: 4px; font-size: 13px; }
  .card-lib.on { background: var(--yellow); color: #1a1400; box-shadow: 0 0 12px rgba(255,225,74,0.6); }
  .badge { position: absolute; bottom: 5px; right: 5px; font-size: 12px;
    background: rgba(5,10,28,0.7); border-radius: 6px; padding: 1px 5px; color: var(--yellow);
    box-shadow: 0 0 8px rgba(255,225,74,0.35); }
  .card-del {
    position: absolute; top: 4px; left: 4px; z-index: 5;
    width: 26px; height: 26px; border: none; border-radius: 50%;
    background: var(--pink); color: #fff; font-size: 18px; line-height: 26px;
    padding: 0; box-shadow: 0 0 10px rgba(255,77,154,0.7);
  }

  .empty-hint { color: var(--muted); font-size: 13px; padding: 24px 8px; text-align: center; }

  .folder-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .folder-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; width: 100%;     min-height: 108px;
    border: none; border-radius: 16px; padding: 12px 8px 10px; text-align: center;
    background: rgba(14,24,64,0.72);
    color: inherit;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.28), 0 0 16px rgba(255,77,154,0.12);
    animation: rise 0.45s ease both;
    transition: transform 0.2s;
  }
  .folder-card:active { transform: scale(0.97); }
  .folder-icon {
    width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: 0 0 16px rgba(79,195,255,0.35);
  }
  .folder-icon.history { background: linear-gradient(135deg, var(--yellow), var(--pink)); }
  .folder-icon.bookmarks { background: linear-gradient(135deg, var(--pink), #7a1fff); }
  .folder-icon.toread { background: linear-gradient(135deg, var(--neon), #2b5cff); }
  .folder-text { display: flex; flex-direction: column; align-items: center; min-width: 0; width: 100%; }
  .folder-title { font-size: 14px; font-weight: 700; line-height: 1.25;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .folder-count { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .folder-chevron { display: none; }

  #libraryFolder { display: none; }
  #libraryFolder.open { display: block; }
  #browsePage { display: none; padding-bottom: 24px; }
  #browsePage.open { display: block; }
  #libraryHome.hidden { display: none; }
  #catalogHome { display: none; padding-bottom: 12px; }
  #catalogHome.open { display: block; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .chip {
    border: none; border-radius: 20px; padding: 7px 11px;
    background: #12204a; color: inherit; font-size: 12px; font-weight: 700;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.28);
  }
  .chip.on { background: var(--neon); color: #041018; }
  .browse-group-title {
    font-size: 14px; font-weight: 700; color: var(--muted);
    margin: 16px 2px 8px; line-height: 1.3;
  }
  .folder-nav {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .folder-nav button {
    border: none; background: rgba(14,24,64,0.9);
    color: inherit; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.3);
  }
  .folder-nav h2 { flex: 1; margin: 0; font-size: 17px; }
  .card-move {
    position: absolute; bottom: 4px; right: 4px; z-index: 3;
    width: 28px; height: 28px; border: none; border-radius: 8px;
    background: var(--neon); color: #041018; font-size: 14px;
    padding: 0; box-shadow: 0 0 10px rgba(79,195,255,0.7);
  }
  .folder-icon.custom { background: linear-gradient(135deg, var(--neon), var(--pink)); }
  .folder-section-label {
    font-size: 13px; font-weight: 700; color: var(--muted); margin: 4px 2px 10px;
  }
  #nestedFolders { margin-bottom: 16px; }
  .pick-list {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px; max-height: 50vh; overflow-y: auto;
  }
  .pick-item {
    min-height: 88px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    width: 100%; padding: 12px 8px;
  }
  .folder-actions {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px;
  }
  .folder-actions button {
    border: none; background: rgba(14,24,64,0.9);
    color: inherit; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.25);
  }
  .folder-actions button.on { background: var(--neon); color: #041018; }
  .folder-actions button.danger { color: var(--pink); background: rgba(255,77,154,0.12); }
  #modalWrap {
    display: none; position: fixed; inset: 0; z-index: 80;
    background: rgba(2,6,20,0.72); align-items: flex-end; justify-content: center;
  }
  #modalWrap.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px; background: #0c1638;
    border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: 0 0 0 1px rgba(79,195,255,0.35), 0 -10px 40px rgba(255,77,154,0.15);
  }
  .modal-sheet h3 { margin: 0 0 12px; font-size: 16px; }
  .modal-sheet input {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: none;
    background: #08102a; color: inherit; font-size: 16px;
    box-shadow: 0 0 0 1px rgba(79,195,255,0.3);
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .modal-actions button, .pick-item {
    flex: 1; border: none; border-radius: 12px; padding: 12px; font-size: 15px; font-weight: 600;
    background: #12204a; color: inherit;
  }
  .modal-actions .ok { background: var(--yellow); color: #1a1400; }

  #reader { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: none; flex-direction: column; }
  #reader.active { display: flex; }
  #readerChrome {
    flex-shrink: 0;
    background: rgba(8,14,40,0.94);
    border-bottom: 1px solid rgba(79,195,255,0.28);
  }
  #reader.chrome-hidden #readerChrome {
    height: 0; padding: 0; overflow: hidden; border: none; opacity: 0;
    pointer-events: none;
  }
  #readerToolbar {
    display: flex; align-items: center; justify-content: space-evenly;
    width: 100%; gap: 0; padding: 4px 4px 8px;
  }
  #readerToolbar button {
    border: none; background: none; font-size: 17px; padding: 8px 0; border-radius: 10px; color: inherit;
    flex: 1; min-width: 0; text-align: center;
  }
  #readerToolbar button.on { background: var(--neon); color: #041018; border-radius: 10px; }
  #bookmarkBtn.on { background: var(--pink); color: #fff; box-shadow: 0 0 12px rgba(255,77,154,0.55); }
  #readerToolbar .fsz { font-size: 13px; background: #12204a; border-radius: 10px; }
  #autoBtn.on { background: var(--yellow); color: #1a1400; }
  #readerMeta { padding: 8px 12px 4px; }
  #readerTitle {
    font-weight: 700; font-size: 14px; line-height: 1.3;
    text-align: left; white-space: normal; overflow: hidden;
    word-break: break-word;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    color: var(--neon);
  }
  #readerProgress { margin-top: 3px; font-size: 12px; color: var(--yellow); opacity: 0.9; }
  #chromePeek {
    display: none; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    z-index: 60; border: none; border-radius: 999px;
    padding: 5px 14px; font-size: 12px; font-weight: 700;
    background: rgba(8,14,40,0.8); color: var(--neon);
    box-shadow: 0 0 14px rgba(79,195,255,0.4);
  }
  #reader.chrome-hidden #chromePeek { display: block; }
  #status { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 15px; white-space: pre-line; }

  #pager { position: relative; flex: 1; overflow-y: hidden; overflow-x: hidden; touch-action: none; overscroll-behavior: none; }
  #pager.scroll-mode { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #columns {
    padding: 4px 20px 40px; line-height: 1.65; font-size: var(--font-size);
    max-width: 100%; overflow-x: hidden; word-wrap: break-word;
    color: #e7edff;
  }
  #columns p { margin: 0 0 1em; text-align: justify; }
  #columns h1, #columns h2, #columns h3, #columns h4 { margin: 1.4em 0 0.7em; line-height: 1.3; color: var(--yellow); }
  hr { border: none; border-top: 1px solid rgba(79,195,255,0.2); margin: 2.5em 0; }
  #tap-prev, #tap-next { position: absolute; top: 0; bottom: 0; width: 25%; z-index: 5; }
  #tap-prev { left: 0; } #tap-next { right: 0; }
  #pager.scroll-mode #tap-prev, #pager.scroll-mode #tap-next { display: none; }
  #pageIndicator { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted); pointer-events: none; background: transparent; }
  #reader:not(.chrome-hidden) #pageIndicator { display: none; }
</style>
</head>
<body>
<div id="bgfx" aria-hidden="true"></div>
<div id="app">
  <div id="screens">
    <div id="searchBar">
      <input id="searchInput" placeholder="Название книги или автор…" />
    </div>
    <div id="searchHint" hidden>Начни печатать, чтобы найти книгу</div>
    <div id="searchResults" class="grid" hidden></div>

    <div class="screen active" id="screen-library">
      <div id="libraryHome">
        <div id="continueBlock" hidden>
          <div class="section-row"><div class="section-head">Читать дальше</div></div>
          <div id="continueGrid"></div>
        </div>
        <div id="recsBlock">
          <div class="section-row">
            <button type="button" class="section-head" id="recsOpen">Рекомендации</button>
            <button type="button" class="more-btn" id="recsMore">Далее ›</button>
          </div>
          <div id="recsGrid" class="grid"></div>
          <button type="button" class="more-btn wide" id="recsMoreWide">Далее — все рекомендации</button>
        </div>
        <div id="popularBlock">
          <div class="section-row">
            <button type="button" class="section-head" id="popularOpen">Популярное</button>
            <button type="button" class="more-btn" id="popularMore">Далее ›</button>
          </div>
          <div id="popularGrid" class="grid"></div>
          <button type="button" class="more-btn wide" id="popularMoreWide">Далее — всё популярное</button>
        </div>
      </div>

      <div id="catalogHome">
        <div class="section-row"><div class="section-head">Библиотека</div></div>
        <div id="catalogGroups"></div>
      </div>

      <div id="browsePage">
        <div class="folder-nav">
          <button type="button" id="browseBack">← Назад</button>
          <h2 id="browseHeading"></h2>
        </div>
        <div id="browseFilters" hidden>
          <div class="chip-row" id="yearChips"></div>
          <div class="chip-row" id="authorChips"></div>
          <button type="button" class="more-btn wide" id="browseDownload">⬇ Скачать этот раздел</button>
        </div>
        <div id="browseBody"></div>
        <div class="empty-hint" id="browseEmpty" hidden>Пока пусто</div>
      </div>

      <div id="libraryFolder">
        <div class="folder-nav">
          <button type="button" id="folderBack">← Назад</button>
          <h2 id="folderHeading"></h2>
        </div>
        <div class="folder-actions">
          <button type="button" id="folderCreate">＋ Создать папку</button>
          <button type="button" id="folderEdit">Изменить</button>
          <button type="button" id="folderRename" hidden>Переименовать</button>
          <button type="button" id="folderDeleteCustom" class="danger" hidden>Удалить папку</button>
        </div>
        <div class="folder-section-label" id="nestedFoldersLabel" hidden>Папки</div>
        <div class="folder-grid" id="nestedFolders" hidden></div>
        <div id="folderGrid" class="grid"></div>
        <div class="empty-hint" id="folderEmpty" hidden>Пока пусто</div>
        <button id="resetBtn" style="margin-top:22px;width:100%;padding:12px;border:none;border-radius:16px;background:rgba(255,77,154,0.12);color:#ff4d9a;font-size:14px;font-weight:600;box-shadow:0 0 0 1px rgba(255,77,154,0.35);">
          🗑 Сбросить любимое и историю
        </button>
      </div>
    </div>
  </div>

  <div id="tabbar">
    <button type="button" id="homeTab" class="active"><span class="icon">⌂</span>Главная</button>
    <button type="button" id="playTab"><span class="icon">▶️</span>Читать</button>
    <button type="button" id="heartTab"><span class="icon">♥</span>На потом</button>
    <button type="button" id="catalogTab"><span class="icon">📚</span>Библиотека</button>
    <button type="button" id="mineTab"><span class="icon">📒</span>Мои книги</button>
  </div>
</div>

<div id="modalWrap">
  <div class="modal-sheet">
    <h3 id="modalTitle">Папка</h3>
    <input id="modalInput" maxlength="60" placeholder="Название папки" />
    <div class="pick-list" id="modalPick" hidden></div>
    <div class="modal-actions">
      <button type="button" id="modalCancel">Отмена</button>
      <button type="button" class="ok" id="modalOk">Готово</button>
    </div>
  </div>
</div>

<div id="reader">
  <div id="readerChrome">
    <div id="readerMeta">
      <div id="readerTitle"></div>
      <div id="readerProgress"></div>
    </div>
    <div id="readerToolbar">
      <button id="backBtn" title="Закрыть книгу">←</button>
      <button id="bookmarkBtn" title="В любимое">♡</button>
      <button id="toReadBtn" title="В мою библиотеку">📚</button>
      <button id="downloadBtn" title="Скачать файл">⬇</button>
      <button class="fsz" id="modeBtn" title="Постранично / лентой">📖</button>
      <button class="fsz" id="autoBtn" title="Старт / пауза автопрокрутки">▶️</button>
      <button class="fsz" id="speedBtn" title="Скорость автопрокрутки">1×</button>
      <button class="fsz" id="smaller" title="Мельче">A-</button>
      <button class="fsz" id="bigger" title="Крупнее">A+</button>
      <button class="fsz" id="hideChromeBtn" title="Спрятать панель">⌃</button>
    </div>
  </div>
  <button type="button" id="chromePeek">настройки ▾</button>
  <div id="status">Загрузка…</div>
  <div id="pager" style="display:none">
    <div id="columns"></div>
    <div id="tap-prev"></div>
    <div id="tap-next"></div>
    <div id="pageIndicator"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#050a1c'); } catch (e) {}
  try { tg.setBackgroundColor('#050a1c'); } catch (e) {}
}
const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;

const params = new URLSearchParams(location.search);
const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
const directBookId = params.get('book') || startParam || null;

const FOLDER_META = {
    history: { title: 'История', empty: 'Пока ничего не открывала', path: 'history' },
  bookmarks: { title: 'На потом', empty: 'Пока никого не лайкнула', path: 'bookmark' },
  toread: { title: 'Мои книги', empty: 'Пока пусто — нажми 📚 на обложке', path: 'to-read' },
};

/* ---------------- helpers ---------------- */
function bookCard(b, opts) {
  opts = opts || {};
  const el = document.createElement('button');
  el.className = 'card';
  el.style.cssText = 'border:none;background:none;padding:0;color:inherit;';
  const badge = b.finished ? '✓' : (b.total_pages ? `${Math.round(100*(b.last_page+1)/b.total_pages)}%` : '');
  el.innerHTML = `
    <div class="cover">
      <img loading="lazy" src="/api/cover/${b.id}" onerror="this.remove()" onload="this.nextElementSibling.remove()" />
      <div class="fallback">📖</div>
      ${badge ? `<div class="badge">${badge}</div>` : ''}
    </div>
    <div class="t">${escapeHtml(b.title || '')}</div>
    <div class="a">${escapeHtml(b.author || '')}</div>
  `;
  if (opts.editable) {
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'card-del';
    del.setAttribute('aria-label', 'Удалить');
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (opts.onRemove) opts.onRemove(b);
    });
    el.querySelector('.cover').appendChild(del);
    if (opts.onMove) {
      const mv = document.createElement('button');
      mv.type = 'button';
      mv.className = 'card-move';
      mv.setAttribute('aria-label', 'В папку');
      mv.textContent = '📁';
      mv.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        opts.onMove(b);
      });
      el.querySelector('.cover').appendChild(mv);
    }
  } else {
    const like = document.createElement('button');
    like.type = 'button';
    like.className = 'card-like' + (isLiked(b.id) ? ' on' : '');
    like.textContent = isLiked(b.id) ? '♥' : '♡';
    like.setAttribute('aria-label', 'Лайк на потом');
    like.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleLike(b, like);
    });
    const lib = document.createElement('button');
    lib.type = 'button';
    lib.className = 'card-lib' + (isInLibrary(b.id) ? ' on' : '');
    lib.textContent = '📚';
    lib.setAttribute('aria-label', 'В мою библиотеку');
    lib.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleLibrary(b, lib);
    });
    el.querySelector('.cover').appendChild(like);
    el.querySelector('.cover').appendChild(lib);
  }
  el.addEventListener('click', () => {
    if (opts.editable) return;
    openReader(b.id);
  });
  return el;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function renderGrid(container, items, opts) {
  container.innerHTML = '';
  items.forEach(b => container.appendChild(bookCard(b, opts)));
}
function pluralBooks(n) {
  const mod10 = n % 10, mod100 = n % 100;
  let word = 'книг';
  if (mod100 < 11 || mod100 > 14) {
    if (mod10 === 1) word = 'книга';
    else if (mod10 >= 2 && mod10 <= 4) word = 'книги';
  }
  return `${n} ${word}`;
}

/* ---------------- search ---------------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchHint = document.getElementById('searchHint');
const screenLibrary = document.getElementById('screen-library');
let searchTimer = null;

function showSearchMode(on) {
  searchResults.hidden = !on;
  searchHint.hidden = !on;
  screenLibrary.hidden = on;
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) {
    searchResults.innerHTML = '';
    showSearchMode(false);
    return;
  }
  if (currentFolder) closeFolder();
  closeBrowse();
  closeCatalog();
  showSearchMode(true);
  searchTimer = setTimeout(() => runSearch(q), 350);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchInput.blur();
});
searchResults.addEventListener('touchstart', () => searchInput.blur(), { passive: true });
async function runSearch(q) {
  searchHint.hidden = false;
  searchHint.textContent = 'Ищу…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const items = await res.json();
    searchHint.hidden = items.length > 0;
    if (!items.length) searchHint.textContent = 'Ничего не нашла 🤷';
    renderGrid(searchResults, items);
  } catch (e) {
    searchHint.hidden = false;
    searchHint.textContent = 'Ошибка поиска';
  }
}

/* ---------------- library ---------------- */
let libraryData = { history: [], bookmarks: [], to_read: [], folders: [], customBooks: {} };
let currentFolder = null;
let folderEditMode = false;
let modalMode = null;
let movingBook = null;
let browseFrom = 'home';
let catalogShelves = [];
let catalogState = { shelf: null, authors: 'any', yearFrom: null, yearTo: null, title: '' };

const YEAR_CHIPS = [
  { id: 'all', label: 'Все годы', from: null, to: null },
  { id: 'y00', label: '2000–2010', from: 2000, to: 2010 },
  { id: 'y10', label: '2010–2020', from: 2010, to: 2020 },
  { id: 'y90', label: 'до 2000', from: 1800, to: 1999 },
];
const AUTHOR_CHIPS = [
  { id: 'any', label: 'Все авторы' },
  { id: 'ru', label: 'Русские' },
  { id: 'en', label: 'Зарубежные' },
];

function isLiked(id) {
  return (libraryData.bookmarks || []).some(x => x.id === id);
}
function isInLibrary(id) {
  return (libraryData.to_read || []).some(x => x.id === id);
}
async function toggleLike(book, btn) {
  if (!userId || !book) return;
  const res = await fetch(`/api/library/${userId}/bookmark/${book.id}`, { method: 'POST' });
  const data = await res.json();
  if (data.bookmarked) {
    if (!isLiked(book.id)) libraryData.bookmarks.unshift(book);
  } else {
    libraryData.bookmarks = libraryData.bookmarks.filter(x => x.id !== book.id);
  }
  if (btn) {
    btn.classList.toggle('on', data.bookmarked);
    btn.textContent = data.bookmarked ? '♥' : '♡';
  }
  if (currentBookId === book.id) {
    isBookmarked = data.bookmarked;
    applyBookmarkVisual();
  }
  if (currentFolder === 'bookmarks' && !folderEditMode) renderFolder();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}
async function toggleLibrary(book, btn) {
  if (!userId || !book) return;
  const res = await fetch(`/api/library/${userId}/to-read/${book.id}`, { method: 'POST' });
  const data = await res.json();
  if (data.to_read) {
    if (!isInLibrary(book.id)) libraryData.to_read.unshift(book);
  } else {
    libraryData.to_read = libraryData.to_read.filter(x => x.id !== book.id);
  }
  if (btn) btn.classList.toggle('on', data.to_read);
  if (currentBookId === book.id) {
    isToRead = data.to_read;
    applyMineVisual();
  }
  if (currentFolder === 'toread' && !folderEditMode) renderFolder();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
}

function customFolderId(key) {
  return key && String(key).startsWith('custom:') ? parseInt(key.slice(7), 10) : null;
}
function folderItems(key) {
  const cid = customFolderId(key);
  if (cid) return libraryData.customBooks[cid] || [];
  if (key === 'history') return libraryData.history;
  if (key === 'bookmarks') return libraryData.bookmarks;
  return libraryData.to_read;
}
function folderTitle(key) {
  const cid = customFolderId(key);
  if (cid) {
    const f = libraryData.folders.find(x => x.id === cid);
    return f ? f.name : 'Папка';
  }
  return FOLDER_META[key].title;
}
function currentSection() {
  const cid = customFolderId(currentFolder);
  if (cid) {
    const f = libraryData.folders.find(x => x.id === cid);
    return (f && f.section) || 'bookmarks';
  }
  return currentFolder;
}
function foldersInSection(section) {
  return (libraryData.folders || []).filter(f => f.section === section);
}
function makeFolderTile(opts) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'folder-card';
  btn.innerHTML = `
    <div class="folder-icon ${opts.iconClass || 'custom'}">${opts.emoji || '📁'}</div>
    <div class="folder-text">
      <div class="folder-title">${escapeHtml(opts.title)}</div>
      <div class="folder-count">${opts.countText || ''}</div>
    </div>
  `;
  btn.addEventListener('click', opts.onClick);
  return btn;
}

function updateFolderCounts() {}

function renderContinueTile() {
  const block = document.getElementById('continueBlock');
  const grid = document.getElementById('continueGrid');
  const book = (libraryData.history && libraryData.history[0]) || (libraryData.to_read && libraryData.to_read[0]) || null;
  grid.innerHTML = '';
  if (!book) { block.hidden = true; return; }
  block.hidden = false;
  grid.appendChild(bookCard(book));
}

async function loadPopular() {
  try {
    const res = await fetch('/api/popular?limit=9');
    const items = await res.json();
    renderGrid(document.getElementById('popularGrid'), (items || []).slice(0, 9));
  } catch (e) { /* тихо */ }
}

async function loadRecs() {
  try {
    const url = userId ? `/api/recommendations/${userId}?limit=9` : '/api/popular?limit=9';
    const res = await fetch(url);
    const items = await res.json();
    renderGrid(document.getElementById('recsGrid'), (items || []).slice(0, 9));
  } catch (e) { /* тихо */ }
}

function closeCatalog() {
  const el = document.getElementById('catalogHome');
  if (el) el.classList.remove('open');
}

function closeBrowse() {
  const page = document.getElementById('browsePage');
  if (!page) return;
  page.classList.remove('open');
  const body = document.getElementById('browseBody');
  if (body) body.innerHTML = '';
  const filters = document.getElementById('browseFilters');
  if (filters) filters.hidden = true;
}

function renderBrowseItems(items) {
  const body = document.getElementById('browseBody');
  const empty = document.getElementById('browseEmpty');
  const grid = document.createElement('div');
  grid.className = 'grid';
  body.appendChild(grid);
  renderGrid(grid, items || []);
  empty.hidden = (items || []).length > 0;
}

async function openBrowse(kind) {
  closeFolder();
  closeCatalog();
  browseFrom = 'home';
  document.getElementById('libraryHome').classList.add('hidden');
  document.getElementById('browseFilters').hidden = true;
  const page = document.getElementById('browsePage');
  const body = document.getElementById('browseBody');
  const empty = document.getElementById('browseEmpty');
  const heading = document.getElementById('browseHeading');
  page.classList.add('open');
  body.innerHTML = '';
  empty.hidden = true;
  empty.textContent = 'Пока пусто';
  heading.textContent = kind === 'recs' ? 'Рекомендации' : 'Популярное';
  setNav('home');
  try {
    if (kind === 'popular') {
      const res = await fetch('/api/popular?limit=48');
      renderBrowseItems(await res.json());
      return;
    }
    if (userId) {
      const res = await fetch(`/api/recommendations/${userId}/by-books`);
      const data = await res.json();
      const groups = (data && data.groups) || [];
      const withItems = groups.filter(g => g.items && g.items.length);
      if (withItems.length) {
        withItems.forEach(g => {
          const title = document.createElement('div');
          title.className = 'browse-group-title';
          const name = (g.book && g.book.title) ? g.book.title : 'этой книги';
          title.textContent = 'Похоже на «' + name + '»';
          body.appendChild(title);
          const grid = document.createElement('div');
          grid.className = 'grid';
          body.appendChild(grid);
          renderGrid(grid, g.items.slice(0, 6));
        });
        empty.hidden = true;
        return;
      }
      const flat = await fetch(`/api/recommendations/${userId}?limit=36`);
      renderBrowseItems(await flat.json());
      return;
    }
    const res = await fetch('/api/popular?limit=36');
    renderBrowseItems(await res.json());
  } catch (e) {
    empty.hidden = false;
    empty.textContent = 'Не получилось загрузить';
  }
}

async function ensureCatalogShelves() {
  if (catalogShelves.length) return catalogShelves;
  const res = await fetch('/api/catalog/shelves');
  catalogShelves = await res.json();
  return catalogShelves;
}

function renderCatalog() {
  const wrap = document.getElementById('catalogGroups');
  wrap.innerHTML = '';
  const groups = [];
  catalogShelves.forEach(s => {
    if (!groups.includes(s.group)) groups.push(s.group);
  });
  groups.forEach(g => {
    const label = document.createElement('div');
    label.className = 'folder-section-label';
    label.textContent = g;
    wrap.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'folder-grid';
    catalogShelves.filter(s => s.group === g).forEach(s => {
      grid.appendChild(makeFolderTile({
        title: s.title,
        emoji: s.emoji,
        iconClass: 'custom',
        countText: s.count ? String(s.count) : 'раздел',
        onClick: () => openShelf(s),
      }));
    });
    wrap.appendChild(grid);
  });
}

async function showCatalog() {
  closeFolder();
  closeBrowse();
  document.getElementById('libraryHome').classList.add('hidden');
  document.getElementById('catalogHome').classList.add('open');
  setNav('catalog');
  try {
    await ensureCatalogShelves();
    renderCatalog();
  } catch (e) {
    document.getElementById('catalogGroups').textContent = 'Не получилось открыть каталог';
  }
}

function paintChips() {
  const yRow = document.getElementById('yearChips');
  const aRow = document.getElementById('authorChips');
  yRow.innerHTML = '';
  aRow.innerHTML = '';
  YEAR_CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + ((catalogState.yearFrom === c.from && catalogState.yearTo === c.to) ? ' on' : '');
    b.textContent = c.label;
    b.addEventListener('click', () => {
      catalogState.yearFrom = c.from;
      catalogState.yearTo = c.to;
      loadShelfBooks();
      paintChips();
    });
    yRow.appendChild(b);
  });
  AUTHOR_CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (catalogState.authors === c.id ? ' on' : '');
    b.textContent = c.label;
    b.addEventListener('click', () => {
      catalogState.authors = c.id;
      loadShelfBooks();
      paintChips();
    });
    aRow.appendChild(b);
  });
}

function shelfQuery() {
  const p = new URLSearchParams();
  p.set('shelf', catalogState.shelf);
  p.set('authors', catalogState.authors || 'any');
  p.set('limit', '24');
  if (catalogState.yearFrom != null) p.set('year_from', String(catalogState.yearFrom));
  if (catalogState.yearTo != null) p.set('year_to', String(catalogState.yearTo));
  return p.toString();
}

async function loadShelfBooks() {
  const empty = document.getElementById('browseEmpty');
  const body = document.getElementById('browseBody');
  body.innerHTML = '';
  empty.hidden = true;
  try {
    const res = await fetch('/api/catalog/books?' + shelfQuery());
    const items = await res.json();
    renderBrowseItems(items);
  } catch (e) {
    empty.hidden = false;
    empty.textContent = 'Не получилось загрузить раздел';
  }
}

async function openShelf(shelf) {
  closeFolder();
  closeCatalog();
  browseFrom = 'catalog';
  catalogState.shelf = shelf.id;
  catalogState.title = shelf.title;
  catalogState.authors = shelf.authors || 'any';
  catalogState.yearFrom = null;
  catalogState.yearTo = null;
  document.getElementById('libraryHome').classList.add('hidden');
  document.getElementById('browsePage').classList.add('open');
  document.getElementById('browseHeading').textContent = shelf.title;
  document.getElementById('browseFilters').hidden = false;
  setNav('catalog');
  paintChips();
  await loadShelfBooks();
}

async function loadLibrary() {
  loadPopular();
  loadRecs();
  if (!userId) {
    renderContinueTile();
    return;
  }
  try {
    const res = await fetch(`/api/library/${userId}/overview`);
    const data = await res.json();
    libraryData.history = data.history || [];
    libraryData.bookmarks = data.bookmarks || [];
    libraryData.to_read = data.to_read || [];
    libraryData.folders = data.folders || [];
    renderContinueTile();
    if (currentFolder) {
      const cid = customFolderId(currentFolder);
      if (cid) await loadCustomFolderBooks(cid);
      renderFolder();
    }
  } catch (e) {
    renderContinueTile();
  }
}

function renderNestedFolderTiles() {
  const grid = document.getElementById('nestedFolders');
  const label = document.getElementById('nestedFoldersLabel');
  const cid = customFolderId(currentFolder);
  if (!currentFolder || cid) {
    grid.hidden = true;
    label.hidden = true;
    grid.innerHTML = '';
    return;
  }
  const folders = foldersInSection(currentFolder);
  grid.innerHTML = '';
  if (currentFolder === 'toread') {
    grid.appendChild(makeFolderTile({
      title: 'История',
      emoji: '🕑',
      iconClass: 'history',
      countText: pluralBooks((libraryData.history || []).length),
      onClick: () => openFolder('history'),
    }));
  }
  folders.forEach(f => {
    grid.appendChild(makeFolderTile({
      title: f.name,
      countText: pluralBooks(f.count || 0),
      onClick: () => openFolder('custom:' + f.id),
    }));
  });
  const has = folders.length > 0 || currentFolder === 'toread';
  grid.hidden = !has;
  label.hidden = !has;
  if (currentFolder === 'toread') label.textContent = 'Разделы';
  else label.textContent = 'Папки';
}

async function loadCustomFolderBooks(id) {
  const res = await fetch(`/api/library/${userId}/folders/${id}`);
  if (!res.ok) return;
  const data = await res.json();
  libraryData.customBooks[id] = data.books || [];
}

async function openFolder(key) {
  closeBrowse();
  closeCatalog();
  currentFolder = key;
  folderEditMode = false;
  document.getElementById('libraryHome').classList.add('hidden');
  document.getElementById('libraryFolder').classList.add('open');
  document.getElementById('folderEdit').textContent = 'Изменить';
  document.getElementById('folderEdit').classList.remove('on');
  const cid = customFolderId(key);
  document.getElementById('folderRename').hidden = !cid;
  document.getElementById('folderDeleteCustom').hidden = !cid;
  if (cid) await loadCustomFolderBooks(cid);
  document.getElementById('folderHeading').textContent = folderTitle(key);
  renderFolder();
}
function closeFolder() {
  currentFolder = null;
  folderEditMode = false;
  document.getElementById('libraryHome').classList.remove('hidden');
  document.getElementById('libraryFolder').classList.remove('open');
}
function renderFolder() {
  if (!currentFolder) return;
  renderNestedFolderTiles();
  const items = folderItems(currentFolder);
  const nestedCount = customFolderId(currentFolder) ? 0 : foldersInSection(currentFolder).length;
  const empty = document.getElementById('folderEmpty');
  empty.hidden = items.length > 0 || nestedCount > 0;
  const cid = customFolderId(currentFolder);
  empty.textContent = cid
    ? 'Папка пустая — нажми «Изменить» в разделе выше и значок 📁 на книге'
    : FOLDER_META[currentFolder].empty;
  renderGrid(document.getElementById('folderGrid'), items, {
    editable: folderEditMode,
    onRemove: removeFromFolder,
    onMove: askMoveBookToFolder,
  });
}

async function removeFromFolder(book) {
  if (!userId || !currentFolder) return;
  const cid = customFolderId(currentFolder);
  try {
    if (cid) {
      await fetch(`/api/library/${userId}/folders/${cid}/books/${book.id}`, { method: 'DELETE' });
    } else {
      const path = FOLDER_META[currentFolder].path;
      await fetch(`/api/library/${userId}/${path}/${book.id}`, { method: 'DELETE' });
    }
    const list = folderItems(currentFolder);
    const idx = list.findIndex(x => x.id === book.id);
    if (idx >= 0) list.splice(idx, 1);
    const folder = libraryData.folders.find(f => f.id === cid);
    if (folder) folder.count = Math.max(0, (folder.count || 1) - 1);
    updateFolderCounts();
    renderFolder();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) { /* тихо */ }
}

function closeModal() {
  document.getElementById('modalWrap').classList.remove('open');
  modalMode = null;
  movingBook = null;
}
function openNameModal(title, value, mode) {
  modalMode = mode;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalInput').hidden = false;
  document.getElementById('modalInput').value = value || '';
  document.getElementById('modalPick').hidden = true;
  document.getElementById('modalOk').hidden = false;
  document.getElementById('modalWrap').classList.add('open');
  setTimeout(() => document.getElementById('modalInput').focus(), 50);
}
function askCreateFolder() {
  openNameModal('Новая папка', '', 'create');
}
function askRenameFolder() {
  const cid = customFolderId(currentFolder);
  if (!cid) return;
  openNameModal('Название папки', folderTitle(currentFolder), 'rename');
}
async function askMoveBookToFolder(book) {
  movingBook = book;
  const cid = customFolderId(currentFolder);
  const section = currentSection();
  const targets = foldersInSection(section).filter(f => f.id !== cid);
  if (!targets.length) {
    openNameModal('Сначала назови новую папку', '', 'create-then-move');
    return;
  }
  modalMode = 'pick';
  document.getElementById('modalTitle').textContent = 'Куда положить книгу?';
  document.getElementById('modalInput').hidden = true;
  document.getElementById('modalOk').hidden = true;
  const pick = document.getElementById('modalPick');
  pick.hidden = false;
  pick.innerHTML = '';
  targets.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick-item folder-card';
    b.innerHTML = `<div class="folder-icon custom">📁</div><div class="folder-title">${escapeHtml(f.name)}</div>`;
    b.addEventListener('click', () => addBookToCustomFolder(f.id, book));
    pick.appendChild(b);
  });
  const extra = document.createElement('button');
  extra.type = 'button';
  extra.className = 'pick-item folder-card';
  extra.innerHTML = `<div class="folder-icon custom">＋</div><div class="folder-title">Новая папка</div>`;
  extra.addEventListener('click', () => openNameModal('Новая папка', '', 'create-then-move'));
  pick.appendChild(extra);
  document.getElementById('modalWrap').classList.add('open');
}

async function addBookToCustomFolder(folderId, book) {
  if (!userId || !book) return;
  try {
    await fetch(`/api/library/${userId}/folders/${folderId}/books/${book.id}`, { method: 'POST' });
    const folder = libraryData.folders.find(f => f.id === folderId);
    if (folder) folder.count = (folder.count || 0) + 1;
    if (libraryData.customBooks[folderId]) {
      if (!libraryData.customBooks[folderId].some(x => x.id === book.id)) {
        libraryData.customBooks[folderId].unshift(book);
      }
    }
    updateFolderCounts();
    closeModal();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) { /* тихо */ }
}

async function submitFolderName() {
  const name = document.getElementById('modalInput').value.trim();
  if (!name || !userId) return;
  if (modalMode === 'rename') {
    const cid = customFolderId(currentFolder);
    const res = await fetch(`/api/library/${userId}/folders/${cid}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (res.ok) {
      const data = await res.json();
      const f = libraryData.folders.find(x => x.id === cid);
      if (f) f.name = data.name;
      document.getElementById('folderHeading').textContent = data.name;
      updateFolderCounts();
    }
    closeModal();
    return;
  }
  const res = await fetch(`/api/library/${userId}/folders`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, section: currentSection() }),
  });
  if (!res.ok) return;
  const created = await res.json();
  libraryData.folders.push(created);
  libraryData.customBooks[created.id] = [];
  const bookToMove = movingBook;
  const thenMove = modalMode === 'create-then-move';
  closeModal();
  if (thenMove && bookToMove) {
    await addBookToCustomFolder(created.id, bookToMove);
  }
  renderFolder();
}

/* ---------------- reader ---------------- */
const readerEl = document.getElementById('reader');
const statusEl = document.getElementById('status');
const pagerEl = document.getElementById('pager');
const columnsEl = document.getElementById('columns');
const readerTitleEl = document.getElementById('readerTitle');
const indicatorEl = document.getElementById('pageIndicator');
const progressEl = document.getElementById('readerProgress');
function applyBookmarkVisual() {
  bookmarkBtn.textContent = isBookmarked ? '♥' : '♡';
  bookmarkBtn.classList.toggle('on', isBookmarked);
}
function applyMineVisual() {
  toReadBtn.classList.toggle('on', isToRead);
}
function findBook(id) {
  const pools = []
    .concat(libraryData.history || [])
    .concat(libraryData.bookmarks || [])
    .concat(libraryData.to_read || []);
  return pools.find(x => x.id === id) || { id };
}

let fontSize = 17;
let pageHeight = 0, totalPages = 1, currentPage = 0;
let currentBookId = null;
let isBookmarked = false, isToRead = false;
let readerMode = 'paged'; // 'paged' | 'scroll'
try { readerMode = localStorage.getItem('reader_mode') || 'paged'; } catch (e) {}

const SPEED_STEPS = [24, 40, 64, 96];
const SPEED_LABELS = ['1×', '2×', '3×', '4×'];
let autoScrollSpeed = 40;
try {
  const savedSpeed = parseInt(localStorage.getItem('auto_scroll_speed') || '', 10);
  if (SPEED_STEPS.includes(savedSpeed)) autoScrollSpeed = savedSpeed;
} catch (e) {}

const modeBtn = document.getElementById('modeBtn');
const speedBtn = document.getElementById('speedBtn');
function applyMode() {
  pagerEl.classList.toggle('scroll-mode', readerMode === 'scroll');
  modeBtn.textContent = readerMode === 'paged' ? '📖' : '📜';
}
function applySpeedLabel() {
  const i = Math.max(0, SPEED_STEPS.indexOf(autoScrollSpeed));
  speedBtn.textContent = SPEED_LABELS[i] || '2×';
}
modeBtn.addEventListener('click', () => {
  readerMode = readerMode === 'paged' ? 'scroll' : 'paged';
  try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
  applyMode();
  if (readerMode === 'paged') requestAnimationFrame(recalcPages);
});
speedBtn.addEventListener('click', () => {
  const i = SPEED_STEPS.indexOf(autoScrollSpeed);
  autoScrollSpeed = SPEED_STEPS[(i + 1) % SPEED_STEPS.length];
  try { localStorage.setItem('auto_scroll_speed', String(autoScrollSpeed)); } catch (e) {}
  applySpeedLabel();
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});

function setChrome(on) {
  readerEl.classList.toggle('chrome-hidden', !on);
  requestAnimationFrame(() => {
    if (readerEl.classList.contains('active') && readerMode === 'paged' && pagerEl.style.display !== 'none') {
      recalcPages();
    }
  });
}
function toggleChrome() { setChrome(readerEl.classList.contains('chrome-hidden')); }
document.getElementById('hideChromeBtn').addEventListener('click', () => setChrome(false));
document.getElementById('chromePeek').addEventListener('click', () => setChrome(true));

function applyFont() { document.documentElement.style.setProperty('--font-size', fontSize + 'px'); }
function saveFont() { try { localStorage.setItem('reader_font_size', String(fontSize)); } catch (e) {} }
function restoreFont() {
  try { const v = localStorage.getItem('reader_font_size'); if (v) fontSize = parseInt(v, 10); } catch (e) {}
  applyFont();
}
document.getElementById('bigger').onclick = () => { fontSize = Math.min(fontSize + 1, 28); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };
document.getElementById('smaller').onclick = () => { fontSize = Math.max(fontSize - 1, 13); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };

// Пагинация НЕ через CSS columns (у WebKit баги при сотнях "страниц"), а
// обычным вертикальным скроллом контейнера — либо листаем программно по
// экрану за раз (paged), либо просто отдаём скролл браузеру (лента).
function recalcPages() {
  pageHeight = pagerEl.clientHeight;
  totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
  goToPage(Math.min(currentPage, totalPages - 1));
}
function updateProgressLabel() {
  const text = `${currentPage + 1} / ${totalPages}`;
  indicatorEl.textContent = text;
  progressEl.textContent = totalPages ? `страница ${currentPage + 1} из ${totalPages}` : '';
}
function goToPage(n) {
  currentPage = Math.max(0, Math.min(n, totalPages - 1));
  pagerEl.scrollTop = currentPage * pageHeight;
  updateProgressLabel();
  saveProgress();
}
function nextPage() { if (readerMode === 'paged') goToPage(currentPage + 1); }
function prevPage() { if (readerMode === 'paged') goToPage(currentPage - 1); }
// click — для мыши/десктопа (свайп/тап там не бывает)
document.getElementById('tap-next').addEventListener('click', nextPage);
document.getElementById('tap-prev').addEventListener('click', prevPage);
// На touch-устройствах и тап, и свайп обрабатываем в одном touch-обработчике
// (не полагаясь на синтетический 'click' — на дочерних див-зонах внутри
// #pager с touch-action:none он срабатывает ненадёжно). Свайп — влево/вправо
// (соответствует тап-зонам tap-prev/tap-next слева/справа экрана).
let touchStartX = null;
pagerEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
pagerEl.addEventListener('touchend', e => {
  if (touchStartX === null || readerMode !== 'paged') { touchStartX = null; return; }
  const endX = e.changedTouches[0].clientX;
  const dx = endX - touchStartX;
  if (Math.abs(dx) > 40) {
    dx < 0 ? nextPage() : prevPage();
  } else {
    // это тап, не свайп — определяем зону по координате
    const w = pagerEl.clientWidth;
    if (endX < w * 0.25) prevPage();
    else if (endX > w * 0.75) nextPage();
    else toggleChrome();
  }
  touchStartX = null;
}, { passive: true });
window.addEventListener('keydown', e => {
  if (!readerEl.classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});
window.addEventListener('resize', () => { if (readerEl.classList.contains('active') && readerMode === 'paged') requestAnimationFrame(recalcPages); });

// в режиме ленты сохраняем позицию по проценту скролла
let scrollSaveTimer = null;
pagerEl.addEventListener('scroll', () => {
  if (readerMode !== 'scroll' || !currentBookId) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => {
    const frac = pagerEl.scrollTop / Math.max(1, columnsEl.scrollHeight - pagerEl.clientHeight);
    currentPage = Math.round(frac * (totalPages - 1));
    updateProgressLabel();
    saveProgress();
  }, 500);
}, { passive: true });

function positionKey(id) { return 'page_' + id; }
let progressTimer = null;
function saveProgress() {
  if (!currentBookId) return;
  try { localStorage.setItem(positionKey(currentBookId), String(currentPage)); } catch (e) {}
  clearTimeout(progressTimer);
  progressTimer = setTimeout(() => {
    if (!userId) return;
    const finished = currentPage >= totalPages - 1;
    fetch(`/api/library/${userId}/progress/${currentBookId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: currentPage, total_pages: totalPages, finished }),
    }).catch(() => {});
  }, 600);
}
function restorePosition(id) {
  let v = 0;
  try { v = parseInt(localStorage.getItem(positionKey(id)) || '0', 10); } catch (e) {}
  return v;
}

async function openReader(bookId) {
  stopAutoScroll();
  currentBookId = bookId;
  currentPage = 0;
  readerEl.classList.add('active');
  setChrome(true);
  statusEl.style.display = 'block';
  pagerEl.style.display = 'none';
  statusEl.textContent = 'Загрузка…\nПри первом открытии книги может занять до минуты.';
  readerTitleEl.textContent = '';
  progressEl.textContent = '';
  bookmarkBtn.classList.remove('on');
  bookmarkBtn.textContent = '♡';
  toReadBtn.classList.remove('on');

  if (userId) {
    fetch(`/api/library/${userId}/state/${bookId}`).then(r => r.json()).then(st => {
      isBookmarked = st.bookmarked; isToRead = st.to_read;
      applyBookmarkVisual();
      applyMineVisual();
    }).catch(() => {});
  }

  try {
    const res = await fetch(`/api/book/${bookId}`);
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const data = await res.json();
    readerTitleEl.textContent = data.title || '';
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    const coverHtml = `<div style="text-align:center;margin:0 0 1.5em;">
      <img src="/api/cover/${bookId}" style="max-width:65%;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.35);" onerror="this.parentElement.remove()" />
    </div>`;
    columnsEl.innerHTML = coverHtml + data.chapters.map(c => c.html).join('<hr/>');
    statusEl.style.display = 'none';
    pagerEl.style.display = 'block';
    applyMode();
    requestAnimationFrame(() => {
      if (readerMode === 'paged') {
        recalcPages();
        goToPage(restorePosition(bookId));
      } else {
        pageHeight = pagerEl.clientHeight;
        totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
        const savedPage = restorePosition(bookId);
        currentPage = savedPage;
        pagerEl.scrollTop = (savedPage / Math.max(1, totalPages - 1)) * (columnsEl.scrollHeight - pagerEl.clientHeight);
        updateProgressLabel();
      }
      // панель прячем через секунду, чтобы не торчала поверх текста
      setTimeout(() => {
        if (currentBookId === bookId && readerEl.classList.contains('active')) setChrome(false);
      }, 1200);
    });
  } catch (e) {
    statusEl.textContent = 'Не удалось загрузить книгу 😕\n' + e.message;
  }
}
// ---------------- автопрокрутка (текст сам ползёт вниз) ----------------
const autoBtn = document.getElementById('autoBtn');
let autoScrollRAF = null;

function stopAutoScroll() {
  if (autoScrollRAF) cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF = null;
  autoBtn.textContent = '▶️';
  autoBtn.classList.remove('on');
}
function startAutoScroll() {
  const begin = () => {
    autoBtn.textContent = '⏸';
    autoBtn.classList.add('on');
    let last = performance.now();
    let y = pagerEl.scrollTop;
    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      // копим дробные пиксели: иначе scrollTop += 0.4 на iOS округляется в 0
      // и на 1×/2× текст стоит на месте
      y += autoScrollSpeed * dt;
      pagerEl.scrollTop = y;
      if (pagerEl.scrollTop + pagerEl.clientHeight >= columnsEl.scrollHeight - 2) {
        stopAutoScroll();
        return;
      }
      autoScrollRAF = requestAnimationFrame(step);
    }
    autoScrollRAF = requestAnimationFrame(step);
  };
  if (readerMode !== 'scroll') {
    readerMode = 'scroll';
    try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
    applyMode();
    // после смены режима вёрстке нужен кадр, чтобы пересчитать scrollHeight —
    // иначе автопрокрутка сразу решает, что уже 'в конце', и тут же гасится
    requestAnimationFrame(() => requestAnimationFrame(begin));
  } else {
    begin();
  }
}
let autoTouchHandled = false;
autoBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  autoTouchHandled = true;
  autoScrollRAF ? stopAutoScroll() : startAutoScroll();
}, { passive: false });
autoBtn.addEventListener('click', () => {
  if (autoTouchHandled) { autoTouchHandled = false; return; }
  autoScrollRAF ? stopAutoScroll() : startAutoScroll();
});

function closeReader() { stopAutoScroll(); setChrome(true); readerEl.classList.remove('active'); currentBookId = null; }
document.getElementById('backBtn').addEventListener('click', closeReader);

bookmarkBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  await toggleLike(findBook(currentBookId));
});
toReadBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  await toggleLibrary(findBook(currentBookId));
});
document.getElementById('downloadBtn').addEventListener('click', async () => {
  if (!currentBookId) return;
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  try {
    if (userId) {
      const res = await fetch(`/api/book/${currentBookId}/send?user_id=${userId}`, { method: 'POST' });
      if (!res.ok) throw new Error('send');
      if (tg && tg.showAlert) tg.showAlert('Файл отправила в чат с ботом. Открой чат — там fb2 или epub.');
      else alert('Файл отправила в чат с ботом.');
    } else {
      window.location.href = `/api/book/${currentBookId}/file`;
    }
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } catch (e) {
    if (tg && tg.showAlert) tg.showAlert('Не получилось скачать. Попробуй ещё раз через минуту.');
    else alert('Не получилось скачать.');
  }
  btn.disabled = false;
});

/* ---------------- init ---------------- */
restoreFont();
applySpeedLabel();
if (directBookId) {
  openReader(directBookId);
} else {
  loadLibrary();
}
