<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Читалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; --font-size: 17px; --accent: var(--tg-theme-button-color, #2481cc); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- layout ---------- */
  #app { display: flex; flex-direction: column; height: 100%; }
  #screens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
  .screen { display: none; padding: 12px 14px 8px; }
  .screen.active { display: block; }

  #tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    border-top: 1px solid rgba(127,127,127,0.2);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 20;
  }
  #tabbar button {
    flex: 1; border: none; background: none; padding: 10px 0 8px;
    font-size: 11px; color: var(--tg-theme-hint-color, #888);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  #tabbar button .icon { font-size: 20px; }
  #tabbar button.active { color: var(--accent); }

  /* ---------- search ---------- */
  #searchInput {
    width: 100%; padding: 10px 14px; border-radius: 12px; border: none;
    background: var(--tg-theme-secondary-bg-color, #f0f0f2);
    color: inherit; font-size: 16px; margin-bottom: 12px;
  }
  #searchInput:focus { outline: 2px solid var(--accent); }
  #searchHint { text-align: center; opacity: 0.5; padding: 40px 20px; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 14px 10px;
  }
  .card { display: flex; flex-direction: column; text-align: left; width: 100%; min-width: 0; }
  .cover {
    width: 100%; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
    background: linear-gradient(135deg, #7f7fd5, #86a8e7 50%, #91eae4);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .fallback { color: #fff; font-size: 30px; opacity: 0.85; padding: 6px; text-align: center; }
  .card .t { font-size: 13px; font-weight: 600; margin-top: 6px; line-height: 1.25;
    overflow-wrap: break-word; word-break: break-word; max-width: 100%; }
  .card .a { font-size: 11.5px; opacity: 0.6; margin-top: 2px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { position: absolute; top: 5px; right: 5px; font-size: 13px;
    background: rgba(0,0,0,0.45); border-radius: 6px; padding: 1px 4px; }

  /* ---------- library ---------- */
  #statsRow { display: flex; gap: 8px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--tg-theme-secondary-bg-color, #f0f0f2); border-radius: 12px;
    padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; opacity: 0.6; }
  .empty-hint { opacity: 0.5; font-size: 13px; padding: 4px 0 18px; }
  section + section { margin-top: 22px; }

  .folder-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .folder-icon {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .folder-icon.history { background: linear-gradient(135deg,#ff9a56,#ff6a88); }
  .folder-icon.bookmarks { background: linear-gradient(135deg,#f6d365,#fda085); }
  .folder-icon.toread { background: linear-gradient(135deg,#43cea2,#185a9d); }
  .folder-text { display: flex; flex-direction: column; }
  .folder-title { font-size: 15px; font-weight: 700; }
  .folder-count { font-size: 12px; opacity: 0.55; }

  /* ---------- reader ---------- */
  #reader { position: fixed; inset: 0; background: var(--tg-theme-bg-color, #fff); z-index: 50; display: none; flex-direction: column; }
  #reader.active { display: flex; }
  #readerToolbar {
    display: flex; align-items: center; gap: 6px; padding: 10px 10px;
    background: var(--tg-theme-secondary-bg-color, #f4f4f5);
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  #readerToolbar button {
    border: none; background: none; font-size: 18px; padding: 6px 8px; border-radius: 8px; color: inherit;
  }
  #readerToolbar button.on { color: var(--accent); }
  #readerToolbar .fsz { font-size: 14px; background: var(--tg-theme-bg-color, #fff); border-radius: 8px; }
  #readerTitle { flex: 1; text-align: center; font-weight: 600; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { padding: 60px 20px; text-align: center; opacity: 0.6; font-size: 15px; white-space: pre-line; }

  /* Пагинация НЕ через CSS columns (у WebKit при сотнях "страниц" там давно
     известные баги с наездом текста/пропажей страниц) — а обычным вертикальным
     скроллом, который мы либо листаем программно по экрану (paged), либо
     отдаём как есть браузеру (scroll/лента). */
  /* overflow-y:hidden в paged-режиме принципиально — иначе WebKit пытается
     ОДНОВРЕМЕННО со своей нативной инерцией скроллить контейнер, пока наш JS
     позиционирует его через scrollTop, и текст дёргается туда-сюда */
  #pager { position: relative; flex: 1; overflow-y: hidden; touch-action: none; overscroll-behavior: none; }
  #pager.scroll-mode { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #columns {
    padding: 4px 20px 40px; line-height: 1.65; font-size: var(--font-size);
  }
  #columns p { margin: 0 0 1em; text-align: justify; }
  #columns h1, #columns h2, #columns h3, #columns h4 { margin: 1.4em 0 0.7em; line-height: 1.3; }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.25); margin: 2.5em 0; }
  #tap-prev, #tap-next { position: absolute; top: 0; bottom: 0; width: 25%; z-index: 5; }
  #tap-prev { left: 0; } #tap-next { right: 0; }
  #pager.scroll-mode #tap-prev, #pager.scroll-mode #tap-next { display: none; }
  #pageIndicator { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: 12px; opacity: 0.5; pointer-events: none; background: var(--tg-theme-bg-color, #fff); }
  #pager.scroll-mode #pageIndicator { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="screens">
    <div class="screen active" id="screen-search">
      <input id="searchInput" placeholder="Название книги или автор…" />
      <div id="searchHint">Начни печатать, чтобы найти книгу</div>
      <div id="searchResults" class="grid"></div>
    </div>

    <div class="screen" id="screen-library">
      <div id="statsRow"></div>
      <section>
        <div class="folder-header">
          <div class="folder-icon history">📖</div>
          <div class="folder-text">
            <div class="folder-title">Продолжить чтение</div>
            <div class="folder-count" id="historyCount">0 книг</div>
          </div>
        </div>
        <div id="historyGrid" class="grid"></div>
        <div class="empty-hint" id="historyEmpty" hidden>Пока ничего не читала</div>
      </section>
      <section>
        <div class="folder-header">
          <div class="folder-icon bookmarks">🔖</div>
          <div class="folder-text">
            <div class="folder-title">Закладки</div>
            <div class="folder-count" id="bookmarksCount">0 книг</div>
          </div>
        </div>
        <div id="bookmarksGrid" class="grid"></div>
        <div class="empty-hint" id="bookmarksEmpty" hidden>Нет закладок</div>
      </section>
      <section>
        <div class="folder-header">
          <div class="folder-icon toread">➕</div>
          <div class="folder-text">
            <div class="folder-title">Читать дальше</div>
            <div class="folder-count" id="toReadCount">0 книг</div>
          </div>
        </div>
        <div id="toReadGrid" class="grid"></div>
        <div class="empty-hint" id="toReadEmpty" hidden>Список пуст</div>
      </section>
      <button id="resetBtn" style="margin-top:26px;width:100%;padding:12px;border:none;border-radius:12px;background:rgba(255,70,70,0.12);color:#ff4757;font-size:14px;font-weight:600;">
        🗑 Сбросить закладки и историю
      </button>
    </div>
  </div>

  <div id="tabbar">
    <button data-tab="search" class="active"><span class="icon">🔍</span>Поиск</button>
    <button data-tab="library"><span class="icon">📚</span>Библиотека</button>
  </div>
</div>

<div id="reader">
  <div id="readerToolbar">
    <button id="backBtn">←</button>
    <button id="bookmarkBtn">🔖</button>
    <button id="toReadBtn">➕</button>
    <span id="readerTitle"></span>
    <button class="fsz" id="modeBtn" title="Постранично / лентой">📖</button>
    <button class="fsz" id="autoBtn" title="Автопрокрутка">▶️</button>
    <button class="fsz" id="smaller">A-</button>
    <button class="fsz" id="bigger">A+</button>
  </div>
  <div id="status">Загрузка…</div>
  <div id="pager" style="display:none">
    <div id="columns"></div>
    <div id="tap-prev"></div>
    <div id="tap-next"></div>
    <div id="pageIndicator"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const userId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;

const params = new URLSearchParams(location.search);
const startParam = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
const directBookId = params.get('book') || startParam || null;

/* ---------------- helpers ---------------- */
function bookCard(b) {
  const el = document.createElement('button');
  el.className = 'card';
  el.style.cssText = 'border:none;background:none;padding:0;color:inherit;';
  const badge = b.finished ? '✓' : (b.total_pages ? `${Math.round(100*(b.last_page+1)/b.total_pages)}%` : '');
  el.innerHTML = `
    <div class="cover">
      <img loading="lazy" src="/api/cover/${b.id}" onerror="this.remove()" onload="this.nextElementSibling.remove()" />
      <div class="fallback">📖</div>
      ${badge ? `<div class="badge">${badge}</div>` : ''}
    </div>
    <div class="t">${escapeHtml(b.title || '')}</div>
    <div class="a">${escapeHtml(b.author || '')}</div>
  `;
  el.addEventListener('click', () => openReader(b.id));
  return el;
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function renderGrid(container, items) {
  container.innerHTML = '';
  items.forEach(b => container.appendChild(bookCard(b)));
}
function pluralBooks(n) {
  const mod10 = n % 10, mod100 = n % 100;
  let word = 'книг';
  if (mod100 < 11 || mod100 > 14) {
    if (mod10 === 1) word = 'книга';
    else if (mod10 >= 2 && mod10 <= 4) word = 'книги';
  }
  return `${n} ${word}`;
}

/* ---------------- tabs ---------------- */
document.querySelectorAll('#tabbar button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
function switchTab(name) {
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  if (name === 'library') loadLibrary();
}

/* ---------------- search ---------------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchHint = document.getElementById('searchHint');
let searchTimer = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { searchResults.innerHTML = ''; searchHint.style.display = 'block'; searchHint.textContent = 'Начни печатать, чтобы найти книгу'; return; }
  searchTimer = setTimeout(() => runSearch(q), 350);
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchInput.blur();
});
searchResults.addEventListener('touchstart', () => searchInput.blur(), { passive: true });
async function runSearch(q) {
  searchHint.style.display = 'block';
  searchHint.textContent = 'Ищу…';
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const items = await res.json();
    searchHint.style.display = items.length ? 'none' : 'block';
    if (!items.length) searchHint.textContent = 'Ничего не нашла 🤷';
    renderGrid(searchResults, items);
  } catch (e) {
    searchHint.style.display = 'block';
    searchHint.textContent = 'Ошибка поиска';
  }
}

/* ---------------- library ---------------- */
async function loadLibrary() {
  if (!userId) return;
  try {
    const res = await fetch(`/api/library/${userId}/overview`);
    const data = await res.json();
    const s = data.stats;
    document.getElementById('statsRow').innerHTML = `
      <div class="stat"><b>${s.books_opened}</b><span>открыто</span></div>
      <div class="stat"><b>${s.books_finished}</b><span>дочитано</span></div>
      <div class="stat"><b>${s.bookmarks_count}</b><span>закладок</span></div>
    `;
    renderGrid(document.getElementById('historyGrid'), data.history);
    document.getElementById('historyEmpty').hidden = data.history.length > 0;
    document.getElementById('historyCount').textContent = pluralBooks(data.history.length);
    renderGrid(document.getElementById('bookmarksGrid'), data.bookmarks);
    document.getElementById('bookmarksEmpty').hidden = data.bookmarks.length > 0;
    document.getElementById('bookmarksCount').textContent = pluralBooks(data.bookmarks.length);
    renderGrid(document.getElementById('toReadGrid'), data.to_read);
    document.getElementById('toReadEmpty').hidden = data.to_read.length > 0;
    document.getElementById('toReadCount').textContent = pluralBooks(data.to_read.length);
  } catch (e) { /* тихо */ }
}

document.getElementById('resetBtn').addEventListener('click', () => {
  const warning = 'Все закладки, список "читать дальше" и история чтения будут удалены без возможности восстановить. Продолжить?';
  const doReset = () => {
    if (!userId) return;
    fetch(`/api/library/${userId}/reset`, { method: 'POST' })
      .then(() => loadLibrary())
      .then(() => { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); });
  };
  if (tg && tg.showConfirm) {
    tg.showConfirm(warning, (ok) => { if (ok) doReset(); });
  } else if (confirm(warning)) {
    doReset();
  }
});

/* ---------------- reader ---------------- */
const readerEl = document.getElementById('reader');
const statusEl = document.getElementById('status');
const pagerEl = document.getElementById('pager');
const columnsEl = document.getElementById('columns');
const readerTitleEl = document.getElementById('readerTitle');
const indicatorEl = document.getElementById('pageIndicator');
const bookmarkBtn = document.getElementById('bookmarkBtn');
const toReadBtn = document.getElementById('toReadBtn');

let fontSize = 17;
let pageHeight = 0, totalPages = 1, currentPage = 0;
let currentBookId = null;
let isBookmarked = false, isToRead = false;
let readerMode = 'paged'; // 'paged' | 'scroll'
try { readerMode = localStorage.getItem('reader_mode') || 'paged'; } catch (e) {}

const modeBtn = document.getElementById('modeBtn');
function applyMode() {
  pagerEl.classList.toggle('scroll-mode', readerMode === 'scroll');
  modeBtn.textContent = readerMode === 'paged' ? '📖' : '📜';
}
modeBtn.addEventListener('click', () => {
  readerMode = readerMode === 'paged' ? 'scroll' : 'paged';
  try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
  applyMode();
  if (readerMode === 'paged') requestAnimationFrame(recalcPages);
});

function applyFont() { document.documentElement.style.setProperty('--font-size', fontSize + 'px'); }
function saveFont() { try { localStorage.setItem('reader_font_size', String(fontSize)); } catch (e) {} }
function restoreFont() {
  try { const v = localStorage.getItem('reader_font_size'); if (v) fontSize = parseInt(v, 10); } catch (e) {}
  applyFont();
}
document.getElementById('bigger').onclick = () => { fontSize = Math.min(fontSize + 1, 28); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };
document.getElementById('smaller').onclick = () => { fontSize = Math.max(fontSize - 1, 13); applyFont(); saveFont(); requestAnimationFrame(recalcPages); };

// Пагинация НЕ через CSS columns (у WebKit баги при сотнях "страниц"), а
// обычным вертикальным скроллом контейнера — либо листаем программно по
// экрану за раз (paged), либо просто отдаём скролл браузеру (лента).
function recalcPages() {
  pageHeight = pagerEl.clientHeight;
  totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
  goToPage(Math.min(currentPage, totalPages - 1));
}
function goToPage(n) {
  currentPage = Math.max(0, Math.min(n, totalPages - 1));
  pagerEl.scrollTop = currentPage * pageHeight;
  indicatorEl.textContent = `${currentPage + 1} / ${totalPages}`;
  saveProgress();
}
function nextPage() { if (readerMode === 'paged') goToPage(currentPage + 1); }
function prevPage() { if (readerMode === 'paged') goToPage(currentPage - 1); }
document.getElementById('tap-next').addEventListener('click', nextPage);
document.getElementById('tap-prev').addEventListener('click', prevPage);
// свайп вертикальный (как в большинстве читалок): вверх — следующая
// страница, вниз — предыдущая. touch-action:none на #pager в paged-режиме
// не даёт браузеру одновременно тянуть нативный скролл поверх этого
let touchStartY = null;
pagerEl.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
pagerEl.addEventListener('touchend', e => {
  if (touchStartY === null || readerMode !== 'paged') { touchStartY = null; return; }
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dy) > 40) { dy < 0 ? nextPage() : prevPage(); }
  touchStartY = null;
}, { passive: true });
window.addEventListener('keydown', e => {
  if (!readerEl.classList.contains('active')) return;
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === 'ArrowLeft') prevPage();
});
window.addEventListener('resize', () => { if (readerEl.classList.contains('active') && readerMode === 'paged') requestAnimationFrame(recalcPages); });

// в режиме ленты сохраняем позицию по проценту скролла
let scrollSaveTimer = null;
pagerEl.addEventListener('scroll', () => {
  if (readerMode !== 'scroll' || !currentBookId) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(() => {
    const frac = pagerEl.scrollTop / Math.max(1, columnsEl.scrollHeight - pagerEl.clientHeight);
    currentPage = Math.round(frac * (totalPages - 1));
    saveProgress();
  }, 500);
}, { passive: true });

function positionKey(id) { return 'page_' + id; }
let progressTimer = null;
function saveProgress() {
  if (!currentBookId) return;
  try { localStorage.setItem(positionKey(currentBookId), String(currentPage)); } catch (e) {}
  clearTimeout(progressTimer);
  progressTimer = setTimeout(() => {
    if (!userId) return;
    const finished = currentPage >= totalPages - 1;
    fetch(`/api/library/${userId}/progress/${currentBookId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: currentPage, total_pages: totalPages, finished }),
    }).catch(() => {});
  }, 600);
}
function restorePosition(id) {
  let v = 0;
  try { v = parseInt(localStorage.getItem(positionKey(id)) || '0', 10); } catch (e) {}
  return v;
}

async function openReader(bookId) {
  stopAutoScroll();
  currentBookId = bookId;
  currentPage = 0;
  readerEl.classList.add('active');
  statusEl.style.display = 'block';
  pagerEl.style.display = 'none';
  statusEl.textContent = 'Загрузка…\nПри первом открытии книги может занять до минуты.';
  readerTitleEl.textContent = '';
  bookmarkBtn.classList.remove('on');
  toReadBtn.classList.remove('on');

  if (userId) {
    fetch(`/api/library/${userId}/state/${bookId}`).then(r => r.json()).then(st => {
      isBookmarked = st.bookmarked; isToRead = st.to_read;
      bookmarkBtn.classList.toggle('on', isBookmarked);
      toReadBtn.classList.toggle('on', isToRead);
    }).catch(() => {});
  }

  try {
    const res = await fetch(`/api/book/${bookId}`);
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    const data = await res.json();
    readerTitleEl.textContent = data.title || '';
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    const coverHtml = `<div style="text-align:center;margin:0 0 1.5em;">
      <img src="/api/cover/${bookId}" style="max-width:65%;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,0.35);" onerror="this.parentElement.remove()" />
    </div>`;
    columnsEl.innerHTML = coverHtml + data.chapters.map(c => c.html).join('<hr/>');
    statusEl.style.display = 'none';
    pagerEl.style.display = 'block';
    applyMode();
    requestAnimationFrame(() => {
      if (readerMode === 'paged') {
        recalcPages();
        goToPage(restorePosition(bookId));
      } else {
        pageHeight = pagerEl.clientHeight;
        totalPages = Math.max(1, Math.round(columnsEl.scrollHeight / pageHeight));
        const savedPage = restorePosition(bookId);
        pagerEl.scrollTop = (savedPage / Math.max(1, totalPages - 1)) * (columnsEl.scrollHeight - pagerEl.clientHeight);
      }
    });
  } catch (e) {
    statusEl.textContent = 'Не удалось загрузить книгу 😕\n' + e.message;
  }
}
// ---------------- автопрокрутка (текст сам ползёт вниз) ----------------
const autoBtn = document.getElementById('autoBtn');
let autoScrollRAF = null;
let autoScrollSpeed = 28; // px/сек, комфортный темп для чтения

function stopAutoScroll() {
  if (autoScrollRAF) cancelAnimationFrame(autoScrollRAF);
  autoScrollRAF = null;
  autoBtn.textContent = '▶️';
  autoBtn.classList.remove('on');
}
function startAutoScroll() {
  if (readerMode !== 'scroll') {
    readerMode = 'scroll';
    try { localStorage.setItem('reader_mode', readerMode); } catch (e) {}
    applyMode();
  }
  autoBtn.textContent = '⏸';
  autoBtn.classList.add('on');
  let last = performance.now();
  function step(now) {
    const dt = (now - last) / 1000;
    last = now;
    pagerEl.scrollTop += autoScrollSpeed * dt;
    if (pagerEl.scrollTop + pagerEl.clientHeight >= columnsEl.scrollHeight - 2) {
      stopAutoScroll();
      return;
    }
    autoScrollRAF = requestAnimationFrame(step);
  }
  autoScrollRAF = requestAnimationFrame(step);
}
autoBtn.addEventListener('click', () => { autoScrollRAF ? stopAutoScroll() : startAutoScroll(); });
// долгий тап — ускорить/замедлить (переключение по кругу)
let autoBtnPressTimer = null;
autoBtn.addEventListener('touchstart', () => {
  autoBtnPressTimer = setTimeout(() => {
    autoScrollSpeed = autoScrollSpeed >= 60 ? 15 : autoScrollSpeed + 15;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }, 500);
}, { passive: true });
autoBtn.addEventListener('touchend', () => clearTimeout(autoBtnPressTimer), { passive: true });

function closeReader() { stopAutoScroll(); readerEl.classList.remove('active'); currentBookId = null; }
document.getElementById('backBtn').addEventListener('click', closeReader);

bookmarkBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  const res = await fetch(`/api/library/${userId}/bookmark/${currentBookId}`, { method: 'POST' });
  const data = await res.json();
  isBookmarked = data.bookmarked;
  bookmarkBtn.classList.toggle('on', isBookmarked);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});
toReadBtn.addEventListener('click', async () => {
  if (!userId || !currentBookId) return;
  const res = await fetch(`/api/library/${userId}/to-read/${currentBookId}`, { method: 'POST' });
  const data = await res.json();
  isToRead = data.to_read;
  toReadBtn.classList.toggle('on', isToRead);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
});

/* ---------------- init ---------------- */
restoreFont();
if (directBookId) {
  openReader(directBookId);
} else {
  switchTab('search');
}
</script>
